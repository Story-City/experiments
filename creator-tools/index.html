<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Story City · Creator Tools: Map + Script</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<script>
window.CACHE_V = '?v=' + Date.now();
document.write(`<link rel="stylesheet" href="app.css${CACHE_V}">`);
</script>
</head>
<body>
<div class="devbar" id="devbar" aria-label="Mockup controls"></div>
<header class="hub">
  <div class="hub__crumbs"><span class="hub__brand">Creator Tools</span><span class="hub__sep">›</span><select id="storyPick" class="hub__story" aria-label="Story"></select></div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="map" id="tabMap"></button>
    <button class="tab" role="tab" data-tab="script" id="tabScript"></button>
  </nav>
  <div class="lang" id="langSwitch" role="group" aria-label="Language"></div>
</header>
<main id="views">
  <section class="view" id="mapView" data-view="map"></section>
  <section class="view" id="scriptView" data-view="script" hidden></section>
</main>
<div class="toast" id="toast" hidden></div>
<section class="about" id="about" hidden role="dialog" aria-modal="true" aria-label="About this mockup"></section>
<script type="module">import(`./app.js${window.CACHE_V}`);</script>
</body>
</html>
