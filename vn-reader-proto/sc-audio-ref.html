<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story City AudioPlayer reference (from RN source)</title>
<style>
  /* Specs from:
     src/components/media/AudioPlayer.tsx
     src/components/media/PlayButton.js
     src/v2/components/ReaderDock/ReaderDockStyles.ts
     theme: primaryGradient #0259A1 → #009EFF, brand purple dock border */
  :root {
    --bg: #170c35;
    --dock-bg: #170c35;
    --brand: #6B46C1;
    --text: #FFFFFF;
    --track-empty: #CCD2E3;
    --grad-a: #0259A1;
    --grad-b: #009EFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: #0a0618;
    color: var(--text);
    font: 16px/1.3 system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 24px 0 0;
  }
  .note {
    max-width: 420px; margin: 0 16px 24px; padding: 12px 14px;
    border: 1px dashed #6B46C1; border-radius: 12px; font-size: 13px; color: #ABB4BD;
  }
  .note strong { color: #fff; }
  .note code { font-size: 11px; color: #6AC1F7; }
  .phone {
    width: 100%; max-width: 390px;
    background: var(--bg);
    min-height: 280px;
    position: relative;
  }
  /* ReaderDock audioOnly */
  .dock {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--dock-bg);
    border: 1px solid var(--brand);
    border-bottom: 0;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 24px rgba(107, 70, 193, 0.35);
    padding: 32px 24px calc(8px + env(safe-area-inset-bottom));
  }
  /* AudioPlayer compact row */
  .audio {
    display: flex; flex-direction: row; align-items: center;
  }
  .scrub { position: relative; flex: 1; margin-right: 20px; padding-top: 10px; }
  .times {
    position: absolute; top: -10px; left: 0;
    font-size: 18px; line-height: 20px; font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 5px; margin: 18px 0 0; border-radius: 3px;
    background: linear-gradient(to right, var(--grad-b) 35%, var(--track-empty) 35%);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
    border: 0; cursor: pointer;
  }
  .play {
    flex: none; width: 40px; height: 40px; border: 0; border-radius: 100px;
    padding: 5px;
    background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
    color: #fff; display: grid; place-items: center; cursor: pointer;
  }
  .play svg { margin-left: 2px; }
</style>
</head>
<body>
  <p class="note">
    <strong>This is not the live React Native component</strong> — experiments can’t mount it.
    It’s a CSS recreation from the real source:
    <code>AudioPlayer.tsx</code>, <code>PlayButton.js</code>, <code>ReaderDockStyles.ts</code>.
    I opened <code>AudioPlayer.tsx</code> in your editor so you can see the real thing.
  </p>
  <div class="phone">
    <footer class="dock" aria-label="Reader dock">
      <div class="audio">
        <div class="scrub">
          <span class="times">0:42 / 2:05</span>
          <input type="range" min="0" max="1" step="0.01" value="0.35" aria-label="Seek">
        </div>
        <button type="button" class="play" aria-label="Play">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><path d="M3 1.5v11l9-5.5z"/></svg>
        </button>
      </div>
    </footer>
  </div>
</body>
</html>
