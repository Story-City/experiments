<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment viewer</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&display=swap">
<link rel="stylesheet" href="hub/night.css">
<script>
// fresh viewer files every load (Pages lets browsers keep them 10 minutes)
window.CACHE_V = '?v=' + Date.now();
document.write(`<link rel="stylesheet" href="hub/view.css${CACHE_V}">`);
</script>
</head>
<body>
<header class="bar">
  <a class="back" href="./" aria-label="Back to all experiments">‹ All</a>
  <div class="title"><span id="title"></span> <span id="stage" class="stage-badge" hidden></span> <span id="status" class="status" hidden></span></div>
  <nav class="page-tabs bar-tabs" data-tabs aria-label="Pages" hidden></nav>
  <a id="direct" class="direct" href="#" target="_blank" rel="noopener">Open alone</a>
</header>

<main class="stage">
  <nav class="page-tabs top-tabs" data-tabs aria-label="Pages" hidden></nav>
  <div class="frame-wrap">
    <iframe id="frame" title="Experiment" allow="camera"></iframe>
    <div id="overlay" class="overlay" hidden></div>
  </div>
  <aside id="panel" class="panel" aria-label="Comments">
    <div class="panel-head">
      <h2 id="panel-title"><span id="comments-label">Comments</span> <span id="open-count"></span></h2>
      <nav id="panel-tabs" class="panel-tabs" role="tablist" aria-label="Panel" hidden>
        <button type="button" role="tab" id="tab-spec" data-pane="spec" aria-controls="pane-spec" aria-selected="true">Spec</button>
        <button type="button" role="tab" id="tab-questions" data-pane="questions" aria-controls="pane-questions" aria-selected="false" tabindex="-1">Questions for design <span id="q-count"></span></button>
      </nav>
      <button id="close" class="icon" type="button" aria-label="Close panel">×</button>
    </div>
    <div id="links" class="links"></div>
    <section id="pane-spec" class="spec" role="tabpanel" aria-labelledby="tab-spec" hidden></section>
    <section id="pane-questions" role="tabpanel" aria-labelledby="tab-questions">
    <div id="notion" class="notion"></div>
    <div id="me" class="me"></div>
    <div class="actions">
      <button id="pin-mode" class="primary" type="button">Add a comment</button>
      <label class="filter"><input id="show-resolved" type="checkbox"> Show resolved</label>
    </div>
    <p id="notice" class="notice" hidden></p>
    <ol id="list" class="list"></ol>
    </section>
  </aside>
</main>
<button id="fab" class="fab" type="button" aria-label="Open comments">💬 <span id="fab-count"></span></button>

<dialog id="compose" class="compose">
  <form method="dialog" id="compose-form">
    <h3 id="compose-title">Comment</h3>
    <img id="shot" alt="Screenshot of the spot" hidden>
    <label>Your name <input id="name" maxlength="60" autocomplete="name" required></label>
    <label>Comment <textarea id="text" rows="4" maxlength="2000" required></textarea></label>
    <div class="row">
      <button value="cancel" type="button" id="cancel">Cancel</button>
      <button id="send" class="primary" type="submit">Send</button>
    </div>
  </form>
</dialog>

<script type="module">import(`./hub/view.js${window.CACHE_V}`);</script>
</body>
</html>
