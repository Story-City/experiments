<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>FTUE sample story choices</title>
<link rel="stylesheet" href="app.css?v=13">
</head>
<body>
  <main class="phone" aria-label="The Summons sample story">
    <header class="top">
      <div class="who">
        <span class="dot" aria-hidden="true"></span>
        <div>
          <strong>Unknown number</strong>
          <small>The Summons</small>
        </div>
      </div>
    </header>

    <div class="thread" id="thread" aria-live="polite">
      <div class="choices" id="choices" hidden></div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
