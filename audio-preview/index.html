<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Story overview: audio preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=21">
</head>
<body>
<main class="screen">
  <div class="dbg" role="group" aria-label="Tip style debug">
    <span class="dbg-label">tip</span>
    <button type="button" class="dbg-btn" data-tip-style="solid" aria-pressed="true">solid</button>
    <button type="button" class="dbg-btn" data-tip-style="place" aria-pressed="false">place</button>
  </div>
  <button type="button" class="back" aria-label="Back">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
  </button>

  <section class="cover" id="cover" aria-label="">
    <img id="coverImg" src="" alt="" width="1200" height="1600">
    <div class="scrim"></div>
    <div class="on-cover">
      <p class="author" id="author"></p>
      <h1 id="title"></h1>
      <div class="badges" aria-label="Story details">
        <span class="chip" id="chipGenre"></span>
        <span class="chip">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/></svg>
          <span id="chipAge"></span>
        </span>
        <span class="chip">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>
          <span id="chipDuration"></span>
        </span>
      </div>
    </div>
  </section>

  <div class="rest">
    <button type="button" class="start" id="start">Start Adventure</button>
    <p class="summary" id="summary"></p>

    <div class="tabs" role="tablist" aria-label="Story">
      <button type="button" role="tab" id="tab-details" aria-controls="panel-details" aria-selected="true" data-tab="details">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 8h.01" stroke-linecap="round"/></svg>
        Details
      </button>
      <button type="button" role="tab" id="tab-reviews" aria-controls="panel-reviews" aria-selected="false" data-tab="reviews">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 17.3l-5.6 3.3 1.5-6.4L3 9.7l6.5-.6L12 3l2.5 6.1 6.5.6-4.9 4.5 1.5 6.4z"/></svg>
        Reviews
      </button>
    </div>

    <section id="panel-details" role="tabpanel" aria-labelledby="tab-details" data-panel="details">
      <div class="voice" id="voice">
        <h2 class="section-title">Meet the cast</h2>
        <div class="cast-stage" id="castStage">
          <div class="cast-track" id="castTrack"></div>
        </div>
        <div class="dots" id="cast" role="tablist" aria-label="Voice demo character"></div>
        <audio id="clip" preload="auto"></audio>
      </div>

      <div class="description" id="description"></div>
    </section>

    <section id="panel-reviews" role="tabpanel" aria-labelledby="tab-reviews" data-panel="reviews" hidden>
      <p class="empty">No reviews yet.</p>
    </section>
  </div>
</main>
<template id="tipSlideTemplate">
  <div class="cast-slide">
    <button type="button" class="tip tip--solid" aria-pressed="false" aria-label="Tap to play audio snippet">
      <span class="tip-place" aria-hidden="true">
        <img class="tip-place-img" src="" alt="">
        <span class="tip-place-scrim"></span>
      </span>
      <span class="tip-body">
        <svg class="audio-icon" width="42" height="34" viewBox="0 0 42 34" fill="none" aria-hidden="true">

          <path class="cone" d="M21.1994 16.9999C21.1994 20.9843 21.1994 24.8358 21.1994 28.8202C21.1994 29.0858 21.1994 29.3515 21.1994 29.6171C21.0669 30.1483 20.6694 30.414 20.1395 30.2812C19.8745 30.2812 19.742 30.1483 19.477 30.0155C16.4297 28.5546 13.3824 26.9608 10.4675 25.4999C9.01012 24.8358 8.34766 23.6405 8.34766 22.1796C8.34766 18.8593 8.34766 15.4062 8.34766 12.0858C8.34766 10.4921 9.01012 9.4296 10.4675 8.76553C13.5148 7.3046 16.4297 5.84366 19.477 4.24991C19.6095 4.1171 19.8745 3.98428 20.1395 3.85147C20.6694 3.71866 21.0669 3.98428 21.1994 4.51553C21.1994 4.78116 21.1994 5.04678 21.1994 5.31241C21.1994 9.16397 21.1994 13.1483 21.1994 16.9999Z" fill="#B9E5FF"/>
          <path class="base" d="M0 17C0 15.2734 0 13.4141 0 11.6875C0 10.4922 0.794953 9.69531 1.98738 9.69531C2.78233 9.69531 3.57729 9.69531 4.23975 9.69531C5.29968 9.69531 6.09464 10.4922 6.09464 11.5547C6.09464 15.1406 6.09464 18.7266 6.09464 22.4453C6.09464 23.5078 5.29968 24.3047 4.23975 24.3047C3.44479 24.3047 2.64984 24.3047 1.85489 24.3047C0.794953 24.3047 0 23.5078 0 22.4453C0 20.5859 0 18.8594 0 17Z" fill="#B9E5FF"/>
        </svg>
        <span class="tip-copy">
          <span class="voice-label">Tap to play audio snippet</span>
          <canvas class="voice-bars" width="240" height="40" hidden aria-hidden="true"></canvas>
        </span>
      </span>
      <p class="voice-by"><span class="voice-by-label">Voice by</span> <span class="voice-by-name"></span></p>
      <img class="sprite" alt="" width="1414" height="2000" src="">
    </button>
  </div>
</template>
<script type="module" src="app.js?v=21"></script>
</body>
</html>
