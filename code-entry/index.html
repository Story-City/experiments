<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Story City · Code Entry</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;600;700;800;900&display=swap">
<script>
window.CACHE_V = '?v=' + Date.now();
document.write(`<link rel="stylesheet" href="app.css${CACHE_V}">`);
</script>
</head>
<body>
<div class="phone" id="phone">

  <!-- Start: just the list of versions; tapping one opens its code screen -->
  <section class="start" id="start">
    <div class="start-body">
      <div class="kicker" id="startKicker"></div>
      <h1 id="startTitle"></h1>
      <p class="start-sub" id="startSub"></p>
      <div class="versions" id="versions" role="group" aria-label="Versions"></div>
    </div>
  </section>

  <!-- Chat: the drop spot -->
  <section class="chat" id="chat" hidden>
    <header class="top">
      <button class="icon" id="chatBack" aria-label="Restart">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="ava" id="topAva"></div>
      <div class="top-title"><b id="topSender"></b><span id="topChapter"></span></div>
    </header>
    <div class="thread" id="thread" aria-live="polite"></div>
    <div class="choices" id="choices" hidden></div>
  </section>

  <!-- Code entry: seal on top, boxes, in-page keypad -->
  <section class="code" id="code" hidden aria-labelledby="codePrompt">
    <header class="top code-top">
      <button class="icon" id="codeBack" aria-label="Restart">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="top-title"><b id="codeTitle"></b><span id="hintsUsed" class="hints-used" hidden></span></div>
      <button class="icon round" id="muteBtn" aria-pressed="false">
        <svg class="i-on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="i-off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
      <button class="icon round help" id="helpBtn">?</button>
    </header>

    <div class="lens" id="lens"></div>

    <button class="solve" id="solveBtn" hidden></button>
    <div class="say-line" id="sayLine">
      <p class="say-text" id="sayText" aria-live="polite"></p>
      <h2 class="code-label" id="codePrompt"><span id="codeLabel"></span></h2>
    </div>

    <div class="boxes" id="boxes" role="status" aria-live="polite"></div>
    <div class="keypad" id="keypad"></div>
  </section>

  <!-- Right answer: the staircase moment -->
  <section class="win" id="win" hidden>
    <div class="win-art" id="winArt" aria-hidden="true"></div>
    <div class="win-say" id="winSay">
      <div class="ava" id="winAva"></div>
      <div class="bub" id="winText"></div>
    </div>
    <div class="win-end" id="winEnd">
      <p class="eyebrow" id="winEyebrow"></p>
      <h1 id="winTitle"></h1>
      <button class="go" id="againBtn"></button>
      <button class="link" id="otherBtn"></button>
    </div>
  </section>
</div>
<script type="module">import(`./app.js${window.CACHE_V}`);</script>
</body>
</html>
