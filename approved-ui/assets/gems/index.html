<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoryCity gem SVGs · categories</title>
<style>
  body { margin: 24px; font: 600 16px/1.4 "Darker Grotesque", system-ui, sans-serif; background: #170c35; color: #fff; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: rgba(255,255,255,.7); font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; max-width: 720px; }
  a.card { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 12px; border-radius: 16px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: #fff; text-decoration: none; }
  a.card img { width: 72px; height: 72px; object-fit: contain; }
  a.card span { font-size: 14px; font-weight: 800; }
  a.card small { font-size: 11px; color: rgba(255,255,255,.55); font-weight: 600; }
</style>
</head>
<body>
  <h1>Gem category SVGs</h1>
  <p>From gem-pins categories. Click one to download, tweak it, then send it back.</p>
  <div class="grid">
    <a class="card" href="nature.svg" download><img src="nature.svg" alt=""><span>nature</span><small>#00CD9D</small></a>
    <a class="card" href="eat-drink.svg" download><img src="eat-drink.svg" alt=""><span>eat &amp; drink</span><small>#FF4F79</small></a>
    <a class="card" href="art.svg" download><img src="art.svg" alt=""><span>culture / art</span><small>#41C7D8</small></a>
    <a class="card" href="play.svg" download><img src="play.svg" alt=""><span>play</span><small>#F7C85C</small></a>
    <a class="card" href="landmarks.svg" download><img src="landmarks.svg" alt=""><span>landmarks</span><small>#F1A638</small></a>
    <a class="card" href="curiosities.svg" download><img src="curiosities.svg" alt=""><span>curiosities</span><small>#B36BFF</small></a>
  </div>
</body>
</html>
