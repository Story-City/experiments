<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tales from the Incident · badges</title>
<style>
  body { margin: 24px; font: 600 15px/1.35 "Darker Grotesque", system-ui, sans-serif; background: #170c35; color: #fff; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  p { margin: 0 0 16px; color: rgba(255,255,255,.7); font-weight: 500; max-width: 40rem; }
  .zip { display: inline-block; margin-bottom: 20px; padding: 10px 16px; border-radius: 999px; background: #00c2ff; color: #0a0620; text-decoration: none; font-weight: 800; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  a.card { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: #fff; text-decoration: none; }
  a.card img { width: 100%; height: 90px; object-fit: contain; background: rgba(0,0,0,.25); border-radius: 8px; }
  a.card span { font-size: 12px; font-weight: 700; line-height: 1.2; }
</style>
</head>
<body>
  <h1>Tales from the Incident · badges</h1>
  <p>Pulled from production GraphQL story achievements (not invented). Download the zip for Figma, or save one image.</p>
  <a class="zip" href="tales-badges.zip" download>Download all (zip)</a>
  <div class="grid" id="grid"></div>
  <script>
    fetch('manifest.json').then((r) => r.json()).then((rows) => {
      const grid = document.getElementById('grid');
      rows.forEach((row) => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = row.file;
        a.download = row.file;
        a.innerHTML = `<img src="${row.file}" alt=""><span>${row.name}</span>`;
        grid.appendChild(a);
      });
    });
  </script>
</body>
</html>
