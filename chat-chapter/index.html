<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Operation COPY/WRITE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wallpaper" aria-hidden="true"></div>

<div class="phone" id="phone">
  <header class="bar glass">
    <button class="icon-btn" id="restartBtn" aria-label="Restart">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="contact">
      <div class="avatar-wrap">
        <img class="avatar" id="headAvatar" alt="">
        <span class="avatar-glitch" id="headFlicker" hidden></span>
      </div>
      <div class="who">
        <div class="name" id="headName"></div>
        <div class="status" id="headStatus"></div>
      </div>
    </div>
    <button class="pill-btn" id="speedBtn" aria-label="Playback speed">1×</button>
  </header>

  <main class="thread" id="thread" aria-live="polite"></main>

  <footer class="dock">
    <div class="choices" id="choices"></div>
    <div class="composer glass">
      <div class="field" id="field"><span class="placeholder">Message</span></div>
      <button class="send" id="sendBtn" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </footer>

  <section class="card-overlay" id="intro">
    <div class="title-card glass">
      <p class="eyebrow">Story City · Chapter 1</p>
      <h1>Operation COPY/WRITE</h1>
      <p class="blurb">You never expected to be recruited during your first University lecture by one of the world’s most secret art societies.</p>
      <button class="cta" id="startBtn">Begin</button>
      <p class="hint">Tap the thread to skip ahead</p>
    </div>
  </section>

  <section class="card-overlay" id="endCard" hidden>
    <div class="title-card glass">
      <p class="eyebrow">End of prototype</p>
      <h1 id="endTitle"></h1>
      <p class="blurb" id="endBody"></p>
      <button class="cta" id="replayBtn">Play again</button>
    </div>
  </section>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
