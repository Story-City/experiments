<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Story City · Gem map pins</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;600;700;800;900&family=Karla:wght@400;600;700&display=swap">
<script>
window.CACHE_V = '?v=' + Date.now();
document.write(`<link rel="stylesheet" href="app.css${CACHE_V}">`);
</script>
</head>
<body>
<!-- GEM-PINS-EDITION-v29: Disc Figma calm U ≤5 gems -->
<button type="button" class="settings-eye" id="settingsEye" aria-pressed="true" aria-label="Hide settings">
  <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
  <svg class="eye-shut" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M2 12s4-7 10-7c1.7 0 3.2.4 4.5 1.1M22 12s-4 7-10 7c-1.7 0-3.2-.4-4.5-1.1"/><path d="M9.5 9.5a3 3 0 0 0 4.2 4.2"/></svg>
</button>
<button type="button" class="reset-filter" id="resetFilter">Reset filter</button>
<aside class="debug-rail" aria-label="Debug">
  <section class="tool-block">
    <h2 class="edition-title">Versioning</h2>
    <div class="edition-bar" role="group" aria-label="Version">
      <button type="button" data-edition="v1" aria-pressed="true">V1</button>
      <button type="button" data-edition="v2" aria-pressed="false">V2</button>
      <button type="button" data-edition="v3" aria-pressed="false">V3</button>
    </div>
    <div class="edition-extra" id="editionExtra">
      <p class="edition-label">Slide-out</p>
      <div class="edition-sheets" role="group" aria-label="Slide-out">
        <button type="button" data-sheet="original" aria-pressed="false">Original</button>
        <button type="button" data-sheet="prompt" aria-pressed="true">Text</button>
        <button type="button" data-sheet="image" aria-pressed="false">Image</button>
        <button type="button" data-sheet="bar" aria-pressed="false">Bar</button>
      </div>
      <div class="tool-toggle">
        <span>Spoof wording</span>
        <button type="button" class="switch" id="debugSpoof" role="switch" aria-checked="false" aria-label="Spoof wording">
          <span class="switch-knob" aria-hidden="true"></span>
        </button>
      </div>
      <div class="tool-toggle">
        <span>Gems / Map pages</span>
        <button type="button" class="switch" id="debugAppPages" role="switch" aria-checked="false" aria-label="Gems / Map pages">
          <span class="switch-knob" aria-hidden="true"></span>
        </button>
      </div>
      <p class="edition-label">Filter layout</p>
      <div class="edition-sheets" role="group" aria-label="Filter layout">
        <button type="button" data-filter-layout="always" aria-pressed="true">Always on</button>
        <button type="button" data-filter-layout="classic" aria-pressed="false">Classic top</button>
        <button type="button" data-filter-layout="inline" aria-pressed="false">Inline legend</button>
        <button type="button" data-filter-layout="disc" aria-pressed="false">Disc colour</button>
        <button type="button" data-filter-layout="disc-haze" aria-pressed="false">Disc haze</button>
        <button type="button" data-filter-layout="corner" aria-pressed="false">Corner</button>
      </div>
      <p class="edition-note">[more filter layout patterns]</p>
    </div>
  </section>
  <section class="tool-block">
    <h2 class="tool-title">Look</h2>
    <label class="accent-pick is-rail" title="Accent color (keeps gradients)">
      <span>Accent</span>
      <input type="color" id="accentColor" value="#00c2ff" aria-label="Accent color">
      <input type="range" id="accentAlpha" min="40" max="100" value="100" aria-label="Accent opacity">
    </label>
    <label class="accent-pick is-rail" title="Secondary radial wash colour + strength">
      <span>Radial</span>
      <input type="color" id="radialColor" value="#b36bff" aria-label="Button radial color">
      <input type="range" id="radialAmount" min="0" max="100" value="55" aria-label="Radial amount">
    </label>
    <label class="accent-pick is-rail" title="How impactful the secondary radial wash is">
      <span>Radial impact</span>
      <input type="range" id="radialImpact" min="0" max="100" value="60" aria-label="Radial impact">
    </label>
    <label class="accent-pick is-rail" title="Page background indigo">
      <span>Background</span>
      <input type="color" id="bgColor" value="#170c35" aria-label="Background color">
      <input type="range" id="bgDepth" min="40" max="100" value="100" aria-label="Background depth">
    </label>
    <div class="tool-toggle">
      <span>Mid tone</span>
      <button type="button" class="switch" id="midToneOn" role="switch" aria-checked="false" aria-label="Mid tone">
        <span class="switch-knob" aria-hidden="true"></span>
      </button>
    </div>
    <label class="accent-pick is-rail is-mid-tone" id="midTonePick" title="Raised / card mid tone" hidden>
      <span>Mid</span>
      <input type="color" id="midToneColor" value="#241b46" aria-label="Mid tone color">
    </label>
    <label class="accent-pick is-rail" title="Corner radius on pills and action buttons">
      <span>Button radius</span>
      <input type="range" id="btnRadius" min="0" max="24" value="24" aria-label="Button corner radius">
      <span class="tool-value" id="btnRadiusValue">pill</span>
    </label>
    <label class="accent-pick is-rail" title="Spacing scale inside the phone">
      <span>Spacing</span>
      <input type="range" id="spaceScale" min="70" max="140" value="100" aria-label="Spacing scale">
      <span class="tool-value" id="spaceScaleValue">100%</span>
    </label>
    <label class="accent-pick is-rail" title="Type size scale inside the phone">
      <span>Type size</span>
      <input type="range" id="typeScale" min="80" max="130" value="100" aria-label="Type size scale">
      <span class="tool-value" id="typeScaleValue">100%</span>
    </label>
  </section>
</aside>
<!-- red-green colour-blind simulation (option 15) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="deutan"><feColorMatrix type="matrix" values="0.625 0.375 0 0 0  0.7 0.3 0 0 0  0 0.3 0.7 0 0  0 0 0 1 0"/></filter>
</svg>

<div class="layout">
  <!-- the 15 options: a panel left of the phone on wide screens, a sheet on phones -->
  <aside class="panel" id="panel" aria-label="Options">
    <div class="panel-top">
      <p class="kicker" id="kicker"></p>
      <button class="panel-close btn ghost" id="panelClose" type="button"></button>
    </div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <div class="panel-actions">
      <button class="btn ghost" id="resetBtn" type="button"></button>
      <button class="btn ghost" id="shareBtn" type="button"></button>
    </div>
    <div class="presets-wrap">
      <p class="presets-title" id="presetsTitle"></p>
      <div class="presets" id="presets" role="group" aria-labelledby="presetsTitle"></div>
      <p class="preset-what" id="presetWhat"></p>
      <div class="try-at" id="tryAt" role="group" aria-label="Run it at"></div>
      <button class="matchup" id="matchup" type="button"></button>
    </div>
    <ol class="opts" id="opts"></ol>
  </aside>

  <!-- the app screen -->
  <main class="phone" id="phone">
    <iframe class="edition-frame" id="editionFrame" title="Gem map pins V2" allow="camera"></iframe>
    <div class="screen" id="screen">
      <div class="map" role="img" aria-label="Map of central Edmonton: Central McDougall and McCauley"></div>
      <div class="pins" id="pins"></div>
    </div>
    <header class="map-top">
      <div class="map-bar">
        <span class="map-title" id="mapTitle"></span>
        <button class="filter-btn" id="filterBtn" type="button" hidden></button>
        <button class="colour-btn" id="colourBtn" type="button" hidden><i></i></button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Show categories"></div>
    </header>
    <div class="key" id="key">
      <button class="key-btn" id="keyBtn" type="button" aria-expanded="false" aria-controls="keyBody"><span id="keyLabel"></span> <span class="count" id="count"></span></button>
      <div class="key-body" id="keyBody"></div>
    </div>
    <button class="options-btn" id="optionsBtn" type="button"></button>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="scrim" id="scrim" hidden></div>
    <section class="sheet" id="sheet" hidden></section>
    <!-- other ways to show a gem's details (option 18) -->
    <div class="catch" id="catch" hidden></div>
    <section class="pop" id="pop" hidden></section>
    <section class="full" id="full" hidden></section>
    <section class="peek" id="peek" hidden></section>
    <section class="gem-sheet" id="gemSheet" hidden aria-label="Gem details"></section>
    <!-- App FloatingTabBar — Map page active here; Gems opens hub. V2 uses iframe bar. -->
    <nav class="app-main-tabs" id="appPagesNav" hidden aria-label="Main">
      <button type="button" class="app-main-tab" data-app-page="explore" aria-pressed="false">
        <svg class="app-main-tab-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M10.9444 4C10.9444 2.89543 10.049 2 8.94439 2H4.5C3.39543 2 2.5 2.89543 2.5 4V12.8C2.5 13.9046 3.39543 14.8 4.5 14.8H8.94439C10.049 14.8 10.9444 13.9046 10.9444 12.8V4ZM21.4998 4C21.4998 2.89543 20.6044 2 19.4998 2H15.0555C13.9509 2 13.0555 2.89543 13.0555 4V4.8C13.0555 5.90457 13.9509 6.8 15.0555 6.8H19.4998C20.6044 6.8 21.4998 5.90457 21.4998 4.8V4ZM2.5 19.2C2.5 18.0954 3.39543 17.2 4.5 17.2H8.94439C10.049 17.2 10.9444 18.0954 10.9444 19.2V20C10.9444 21.1046 10.049 22 8.94439 22H4.5C3.39543 22 2.5 21.1046 2.5 20V19.2ZM21.4998 11.2C21.4998 10.0954 20.6044 9.2 19.4998 9.2H15.0555C13.9509 9.2 13.0555 10.0954 13.0555 11.2V20C13.0555 21.1046 13.9509 22 15.0555 22H19.4998C20.6044 22 21.4998 21.1046 21.4998 20V11.2Z" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span>Explore</span>
      </button>
      <button type="button" class="app-main-tab" data-app-page="feed" aria-pressed="false">
        <svg class="app-main-tab-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3.85714 2C2.83417 2 1.85309 2.39509 1.12973 3.09835C0.406376 3.80161 0 4.75544 0 5.75V18.25C0 19.2446 0.406376 20.1984 1.12973 20.9016C1.85309 21.6049 2.83417 22 3.85714 22H20.1429C21.1658 22 22.1469 21.6049 22.8703 20.9016C23.5936 20.1984 24 19.2446 24 18.25V5.75C24 4.75544 23.5936 3.80161 22.8703 3.09835C22.1469 2.39509 21.1658 2 20.1429 2H3.85714ZM1.71429 5.75C1.71429 5.19747 1.94005 4.66756 2.34191 4.27686C2.74378 3.88616 3.28882 3.66667 3.85714 3.66667H20.1429C20.7112 3.66667 21.2562 3.88616 21.6581 4.27686C22.0599 4.66756 22.2857 5.19747 22.2857 5.75V18.25C22.2857 18.8025 22.0599 19.3324 21.6581 19.7231C21.2562 20.1138 20.7112 20.3333 20.1429 20.3333H3.85714C3.28882 20.3333 2.74378 20.1138 2.34191 19.7231C1.94005 19.3324 1.71429 18.8025 1.71429 18.25V5.75ZM8.57143 8.6675V15.3333C8.57153 15.4771 8.6099 15.6185 8.68283 15.7436C8.75575 15.8687 8.86074 15.9734 8.98758 16.0474C9.11442 16.1213 9.25879 16.1622 9.40666 16.1658C9.55453 16.1695 9.70086 16.1359 9.83143 16.0683L16.2583 12.7358C16.3952 12.6647 16.5097 12.5588 16.5895 12.4293C16.6693 12.2999 16.7115 12.1518 16.7115 12.0008C16.7115 11.8499 16.6693 11.7018 16.5895 11.5724C16.5097 11.4429 16.3952 11.337 16.2583 11.2658L9.83229 7.9325C9.70163 7.86468 9.55513 7.83093 9.40706 7.83454C9.259 7.83815 9.11442 7.87901 8.98743 7.95312C8.86044 8.02723 8.75537 8.13207 8.68246 8.25742C8.60955 8.38276 8.5713 8.5235 8.57143 8.6675Z" fill="currentColor"/>
        </svg>
        <span>Feed</span>
      </button>
      <button type="button" class="app-main-tab is-active" data-app-page="map" aria-pressed="true" aria-current="page">
        <svg class="app-main-tab-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM10 5.47l4 1.4v11.66l-4-1.4V5.47zm-5 .99l3 1.01v11.7l-3-1.16V6.46zm14 11.08l-3 1.16V7.18l3-1.16v11.52z" fill="currentColor"/>
        </svg>
        <span>Map</span>
      </button>
      <button type="button" class="app-main-tab" data-app-page="gems" aria-pressed="false">
        <svg class="app-main-tab-ico app-main-tab-gem" viewBox="0 0 24 22" fill="none" aria-hidden="true">
          <path d="M7 1.5H17L22.5 7.5L12 20.5L1.5 7.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>

  </main>
</div>
<script type="module">import(`./app.js${window.CACHE_V}`);</script>
<script>
(function () {
  const frame = document.getElementById('editionFrame');
  let sheet = 'prompt';
  let filterLayout = 'always';
  function sendSheet() {
    if (!frame.contentWindow) return;
    frame.contentWindow.postMessage({ type: 'gem-pins-sheet', sheet: sheet }, '*');
  }
  function sendFilterLayout() {
    if (!frame.contentWindow) return;
    frame.contentWindow.postMessage({ type: 'gem-pins-filter-layout', layout: filterLayout }, '*');
  }
  function showFrame() {
    if (document.body.classList.contains('is-v2')) frame.classList.add('is-shown');
  }
  // Versions shown in the frame. V3 is Melissa's copy of V2 (26 Nov), so it uses the same
  // V2 controls (the is-v2 class). Bump a ?v= here when that version's files change.
  const FRAMES = { v2: '../gem-pins-v2/?v=52', v3: '../gem-pins-v3/?v=3' };
  function apply(edition) {
    const src = FRAMES[edition];
    document.body.classList.toggle('is-v2', !!src);
    if (src && frame.dataset.edition !== edition) {
      frame.classList.remove('is-shown');
      frame.src = src + '&embed=1&sheet=' + sheet;
      frame.dataset.edition = edition;
      frame.title = 'Gem map pins ' + edition.toUpperCase();
    } else if (src) {
      showFrame();
      sendSheet();
    } else {
      frame.classList.remove('is-shown');
    }
    document.querySelectorAll('[data-edition]').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.edition === (src ? edition : 'v1')));
    });
  }
  frame.addEventListener('load', () => { showFrame(); sendSheet(); sendFilterLayout(); });
  const startEdition = new URLSearchParams(location.search).get('edition');
  apply(FRAMES[startEdition] ? startEdition : 'v1');
  document.querySelectorAll('[data-edition]').forEach((b) => {
    b.addEventListener('click', () => {
      const edition = b.dataset.edition;
      const url = new URL(location.href);
      if (FRAMES[edition]) url.searchParams.set('edition', edition);
      else url.searchParams.delete('edition');
      history.replaceState(null, '', url);
      apply(edition);
    });
  });
  document.querySelectorAll('[data-sheet]').forEach((b) => {
    b.addEventListener('click', () => {
      sheet = b.dataset.sheet;
      document.querySelectorAll('[data-sheet]').forEach((n) => {
        n.setAttribute('aria-pressed', String(n.dataset.sheet === sheet));
      });
      sendSheet();
    });
  });
  document.querySelectorAll('[data-filter-layout]').forEach((b) => {
    b.addEventListener('click', () => {
      filterLayout = b.dataset.filterLayout;
      document.querySelectorAll('[data-filter-layout]').forEach((n) => {
        n.setAttribute('aria-pressed', String(n.dataset.filterLayout === filterLayout));
      });
      sendFilterLayout();
    });
  });

  const accentColor = document.getElementById('accentColor');
  const accentAlpha = document.getElementById('accentAlpha');
  const radialColor = document.getElementById('radialColor');
  const radialAmount = document.getElementById('radialAmount');
  const radialImpact = document.getElementById('radialImpact');
  const bgColor = document.getElementById('bgColor');
  const bgDepth = document.getElementById('bgDepth');
  const midToneOn = document.getElementById('midToneOn');
  const midToneColor = document.getElementById('midToneColor');
  const midTonePick = document.getElementById('midTonePick');
  const btnRadius = document.getElementById('btnRadius');
  const btnRadiusValue = document.getElementById('btnRadiusValue');
  const spaceScale = document.getElementById('spaceScale');
  const spaceScaleValue = document.getElementById('spaceScaleValue');
  const typeScale = document.getElementById('typeScale');
  const typeScaleValue = document.getElementById('typeScaleValue');
  const BTN_RADIUS_PILL = 24;
  function hexToRgb(hex) {
    const h = String(hex || '').replace('#', '');
    const n = h.length === 3 ? h.split('').map((c) => c + c).join('') : h;
    return { r: parseInt(n.slice(0, 2), 16), g: parseInt(n.slice(2, 4), 16), b: parseInt(n.slice(4, 6), 16) };
  }
  function publishLook() {
    const hex = accentColor.value || '#00c2ff';
    const alpha = (Number(accentAlpha.value) || 100) / 100;
    const { r, g, b } = hexToRgb(hex);
    const deep = `rgb(${Math.max(0, r - 40)}, ${Math.max(0, g - 50)}, ${Math.max(0, b - 20)})`;
    const accent = `rgba(${r}, ${g}, ${b}, ${alpha})`;
    const solid = `rgb(${r}, ${g}, ${b})`;
    const rad = hexToRgb(radialColor.value || '#b36bff');
    const amount = (Number(radialAmount.value) || 55) / 100;
    const impact = (Number(radialImpact.value) || 60) / 100;
    const radAlpha = 0.35 * amount + 0.65 * amount * impact;
    const spreadX = 140 + Math.round(120 * impact);
    const spreadY = 55 + Math.round(35 * impact);
    const fade = 58 + Math.round(22 * (1 - impact));
    const bg = hexToRgb(bgColor.value || '#170c35');
    const depth = (Number(bgDepth.value) || 100) / 100;
    const bgOut = `rgb(${Math.round(bg.r * depth)}, ${Math.round(bg.g * depth)}, ${Math.round(bg.b * depth)})`;
    const midOn = midToneOn.getAttribute('aria-checked') === 'true';
    midTonePick.hidden = !midOn;
    const raised = midOn ? midToneColor.value : '#241b46';
    const radiusN = Number(btnRadius && btnRadius.value);
    const radiusPill = !Number.isFinite(radiusN) || radiusN >= BTN_RADIUS_PILL;
    const radiusPx = radiusPill ? '999px' : `${Math.max(0, radiusN)}px`;
    if (btnRadiusValue) btnRadiusValue.textContent = radiusPill ? 'pill' : `${Math.max(0, radiusN)}`;
    const spacePct = Number(spaceScale && spaceScale.value) || 100;
    if (spaceScaleValue) spaceScaleValue.textContent = `${spacePct}%`;
    const typePct = Number(typeScale && typeScale.value) || 100;
    if (typeScaleValue) typeScaleValue.textContent = `${typePct}%`;
    const vars = {
      '--accent': solid,
      '--accent-deep': deep,
      '--brand-accent': accent,
      '--bg': bgOut,
      '--raised': raised,
      '--surface': raised,
      '--btn-radial': `rgba(${rad.r}, ${rad.g}, ${rad.b}, ${radAlpha})`,
      '--btn-radial-wash': `radial-gradient(ellipse ${spreadX}% ${spreadY}% at 50% 45%, rgba(${rad.r}, ${rad.g}, ${rad.b}, ${radAlpha}), transparent ${fade}%)`,
      '--btn-radius': radiusPx,
      '--space-scale': String(spacePct / 100),
      '--type-scale': String(typePct / 100),
    };
    for (const [k, v] of Object.entries(vars)) document.documentElement.style.setProperty(k, v);
    if (frame.contentWindow) frame.contentWindow.postMessage({ type: 'gem-pins-look', vars: vars }, '*');
  }
  [accentColor, accentAlpha, radialColor, radialAmount, radialImpact, bgColor, bgDepth, midToneColor, btnRadius, spaceScale, typeScale].forEach((el) => {
    if (el) el.addEventListener('input', publishLook);
  });
  midToneOn.addEventListener('click', () => {
    midToneOn.setAttribute('aria-checked', midToneOn.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
    publishLook();
  });
  frame.addEventListener('load', publishLook);
  publishLook();

  const eye = document.getElementById('settingsEye');
  eye.addEventListener('click', () => {
    const open = document.body.classList.toggle('is-settings-hidden');
    eye.setAttribute('aria-pressed', String(!open));
    eye.setAttribute('aria-label', open ? 'Show settings' : 'Hide settings');
  });
  document.getElementById('resetFilter').addEventListener('click', () => {
    if (frame.contentWindow) frame.contentWindow.postMessage({ type: 'gem-pins-reset-filter' }, '*');
  });
  const debugSpoof = document.getElementById('debugSpoof');
  function publishSpoof() {
    const on = debugSpoof.getAttribute('aria-checked') === 'true';
    if (frame.contentWindow) frame.contentWindow.postMessage({ type: 'gem-pins-spoof', spoof: on }, '*');
  }
  debugSpoof.addEventListener('click', () => {
    debugSpoof.setAttribute('aria-checked', debugSpoof.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
    publishSpoof();
  });
  frame.addEventListener('load', () => { publishSpoof(); sendFilterLayout(); });

  const APP_PAGES_GEMS_HREF = '../location-gems/?v=109&appPages=1';
  const APP_PAGES_PARAM = 'appPages';
  const debugAppPages = document.getElementById('debugAppPages');
  const appPagesNav = document.getElementById('appPagesNav');
  const phone = document.getElementById('phone');
  function setAppPagesMode(on) {
    if (debugAppPages) debugAppPages.setAttribute('aria-checked', on ? 'true' : 'false');
    if (phone) phone.classList.toggle('has-app-pages', on);
    const v2 = document.body.classList.contains('is-v2');
    if (appPagesNav) appPagesNav.hidden = !on || v2;
    const url = new URL(location.href);
    if (on) url.searchParams.set(APP_PAGES_PARAM, '1');
    else url.searchParams.delete(APP_PAGES_PARAM);
    history.replaceState(null, '', url);
  }
  setAppPagesMode(new URLSearchParams(location.search).get(APP_PAGES_PARAM) === '1');
  if (debugAppPages) {
    debugAppPages.addEventListener('click', () => {
      setAppPagesMode(debugAppPages.getAttribute('aria-checked') !== 'true');
    });
  }
  if (appPagesNav) {
    appPagesNav.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-app-page]');
      if (!btn || btn.classList.contains('is-active')) return;
      if (btn.dataset.appPage === 'gems') location.href = APP_PAGES_GEMS_HREF;
    });
  }
  window.addEventListener('message', (e) => {
    if (!e.data || e.data.type !== 'gem-pins-open-gems') return;
    location.href = APP_PAGES_GEMS_HREF;
  });
})();
</script>
<!-- Move tools (select, drag, size, lock, undo) for V1, V2 and V3: shared/figma-light-studio -->
<script src="../shared/figma-light-studio/studio.js?v=1"></script>
<script>
FigmaLightStudio.mount({
  rail: '.debug-rail',
  storage: 'gem-pins-studio',
  look: '.debug-rail .tool-block input[id]',
  target() {
    const frame = document.getElementById('editionFrame');
    if (document.body.classList.contains('is-v2') && frame && frame.dataset.edition) {
      const root = frame.contentDocument && frame.contentDocument.getElementById('phone');
      return { key: frame.dataset.edition, root };
    }
    return { key: 'v1', root: document.getElementById('phone') };
  },
});
</script>
