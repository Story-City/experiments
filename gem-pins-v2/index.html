<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gem map pins V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;700;800;900&display=swap">
<link rel="stylesheet" href="app.css?v=50">
<meta http-equiv="Cache-Control" content="no-cache">
</head>
<body>
  <header class="page-head">
    <p class="eyebrow">StoryCity · experiments</p>
    <h1>Gem map pins V2</h1>
    <p class="lede">Melissa’s map, Victoria’s gems. Filter is the top bar. Switch the slide-out below.</p>
  </header>

  <div class="sheet-switch" id="sheetSwitch" role="group" aria-label="Slide-out version">
    <button type="button" data-sheet="original">Original</button>
    <button type="button" data-sheet="prompt">Prompt</button>
    <button type="button" data-sheet="image">Image</button>
    <button type="button" data-sheet="bar">Bar</button>
  </div>
  <div class="layout-switch" id="layoutSwitch" role="group" aria-label="Filter layout">
    <button type="button" data-filter-layout="always" aria-pressed="true">Always on</button>
    <button type="button" data-filter-layout="classic" aria-pressed="false">Classic top</button>
    <button type="button" data-filter-layout="inline" aria-pressed="false">Inline legend</button>
    <button type="button" data-filter-layout="disc" aria-pressed="false">Disc colour</button>
    <button type="button" data-filter-layout="disc-haze" aria-pressed="false">Disc haze</button>
    <button type="button" data-filter-layout="corner" aria-pressed="false">Corner</button>
  </div>
  <p class="layout-note">[more filter layout patterns]</p>

  <main class="phone" id="phone">
    <div class="screen" id="screen">
      <div class="map" id="map"></div>
      <div class="pins" id="pins"></div>
    </div>

    <header class="map-top">
      <div class="gbox" id="filterGbox">
        <div class="map-bar" id="mapBar">
          <div class="nearby-row" id="nearbyRow">
            <span class="nearby-ico" id="nearbyIco" aria-hidden="true"></span>
            <p class="nearby-title" id="nearbyTitle">Gems nearby</p>
          </div>
          <div class="legend" id="legend" hidden></div>
          <div class="top-roller-slot" id="topRollerSlot">
            <div class="roller-wrap" id="rollerWrap">
              <div class="roller" id="roller" role="listbox" aria-label="Filter gems"></div>
            </div>
          </div>
          <div class="disc-stage" id="discStage" hidden>
            <svg class="disc-arc" id="discArc" viewBox="0 0 400 100" preserveAspectRatio="none" aria-hidden="true">
              <!-- Soft mid glow + thin tint; long mask fade avoids a hard cut on the bloom -->
              <path
                class="disc-arc-glow"
                d="M 68 36 Q 200 112 332 36"
                fill="none"
                stroke="currentColor"
                stroke-width="5"
                stroke-linecap="round"
                opacity="0.22"
              />
              <path
                class="disc-arc-tint"
                d="M 68 36 Q 200 112 332 36"
                fill="none"
                stroke="currentColor"
                stroke-width="2.25"
                stroke-linecap="round"
                opacity="0.92"
              />
            </svg>
            <div class="disc-wheel" id="discWheel" role="listbox" aria-label="Filter gems on disc"></div>
            <div class="disc-caption" id="discCaption">
              <p class="disc-title" id="discTitle"></p>
              <p class="disc-note" id="discNote"></p>
            </div>
          </div>
          <button type="button" class="filter-btn" id="filterBtn" aria-pressed="false" aria-label="Filter">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"/></svg>
          </button>
        </div>
      </div>
    </header>
    <!-- Corner = same disc arc rotated into top-left (Figma); Disc colour untouched -->
    <div class="corner-disc-wrap" id="cornerDiscWrap" hidden>
      <div class="corner-disc-caption">
        <p class="disc-title" id="cornerDiscTitle"></p>
        <p class="disc-note" id="cornerDiscNote"></p>
      </div>
      <div class="corner-disc-stage" id="cornerDiscStage">
        <svg class="disc-arc" id="cornerDiscArc" viewBox="0 0 400 100" preserveAspectRatio="none" aria-hidden="true">
          <path
            class="disc-arc-glow"
            d="M 68 36 Q 200 112 332 36"
            fill="none"
            stroke="currentColor"
            stroke-width="5"
            stroke-linecap="round"
            opacity="0.22"
          />
          <path
            class="disc-arc-tint"
            d="M 68 36 Q 200 112 332 36"
            fill="none"
            stroke="currentColor"
            stroke-width="2.25"
            stroke-linecap="round"
            opacity="0.92"
          />
        </svg>
        <div class="disc-wheel" id="cornerDiscWheel" role="listbox" aria-label="Filter gems on corner disc"></div>
      </div>
    </div>
    <!-- Tab icons pulled from mobile-rn FloatingTabBar + GemIcon (assets/app-icons/*.tsx) -->
    <nav class="tab-bar" id="tabBar" aria-label="Main">
      <button type="button" class="tab" data-tab="explore" aria-pressed="false">
        <svg class="tab-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M10.9444 4C10.9444 2.89543 10.049 2 8.94439 2H4.5C3.39543 2 2.5 2.89543 2.5 4V12.8C2.5 13.9046 3.39543 14.8 4.5 14.8H8.94439C10.049 14.8 10.9444 13.9046 10.9444 12.8V4ZM21.4998 4C21.4998 2.89543 20.6044 2 19.4998 2H15.0555C13.9509 2 13.0555 2.89543 13.0555 4V4.8C13.0555 5.90457 13.9509 6.8 15.0555 6.8H19.4998C20.6044 6.8 21.4998 5.90457 21.4998 4.8V4ZM2.5 19.2C2.5 18.0954 3.39543 17.2 4.5 17.2H8.94439C10.049 17.2 10.9444 18.0954 10.9444 19.2V20C10.9444 21.1046 10.049 22 8.94439 22H4.5C3.39543 22 2.5 21.1046 2.5 20V19.2ZM21.4998 11.2C21.4998 10.0954 20.6044 9.2 19.4998 9.2H15.0555C13.9509 9.2 13.0555 10.0954 13.0555 11.2V20C13.0555 21.1046 13.9509 22 15.0555 22H19.4998C20.6044 22 21.4998 21.1046 21.4998 20V11.2Z" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span>Explore</span>
      </button>
      <button type="button" class="tab" data-tab="feed" aria-pressed="false">
        <svg class="tab-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3.85714 2C2.83417 2 1.85309 2.39509 1.12973 3.09835C0.406376 3.80161 0 4.75544 0 5.75V18.25C0 19.2446 0.406376 20.1984 1.12973 20.9016C1.85309 21.6049 2.83417 22 3.85714 22H20.1429C21.1658 22 22.1469 21.6049 22.8703 20.9016C23.5936 20.1984 24 19.2446 24 18.25V5.75C24 4.75544 23.5936 3.80161 22.8703 3.09835C22.1469 2.39509 21.1658 2 20.1429 2H3.85714ZM1.71429 5.75C1.71429 5.19747 1.94005 4.66756 2.34191 4.27686C2.74378 3.88616 3.28882 3.66667 3.85714 3.66667H20.1429C20.7112 3.66667 21.2562 3.88616 21.6581 4.27686C22.0599 4.66756 22.2857 5.19747 22.2857 5.75V18.25C22.2857 18.8025 22.0599 19.3324 21.6581 19.7231C21.2562 20.1138 20.7112 20.3333 20.1429 20.3333H3.85714C3.28882 20.3333 2.74378 20.1138 2.34191 19.7231C1.94005 19.3324 1.71429 18.8025 1.71429 18.25V5.75ZM8.57143 8.6675V15.3333C8.57153 15.4771 8.6099 15.6185 8.68283 15.7436C8.75575 15.8687 8.86074 15.9734 8.98758 16.0474C9.11442 16.1213 9.25879 16.1622 9.40666 16.1658C9.55453 16.1695 9.70086 16.1359 9.83143 16.0683L16.2583 12.7358C16.3952 12.6647 16.5097 12.5588 16.5895 12.4293C16.6693 12.2999 16.7115 12.1518 16.7115 12.0008C16.7115 11.8499 16.6693 11.7018 16.5895 11.5724C16.5097 11.4429 16.3952 11.337 16.2583 11.2658L9.83229 7.9325C9.70163 7.86468 9.55513 7.83093 9.40706 7.83454C9.259 7.83815 9.11442 7.87901 8.98743 7.95312C8.86044 8.02723 8.75537 8.13207 8.68246 8.25742C8.60955 8.38276 8.5713 8.5235 8.57143 8.6675Z" fill="currentColor"/>
        </svg>
        <span>Feed</span>
      </button>
      <button type="button" class="tab is-active" data-tab="map" aria-pressed="true" aria-current="page">
        <svg class="tab-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM10 5.47l4 1.4v11.66l-4-1.4V5.47zm-5 .99l3 1.01v11.7l-3-1.16V6.46zm14 11.08l-3 1.16V7.18l3-1.16v11.52z" fill="currentColor"/>
        </svg>
        <span>Map</span>
      </button>
      <button type="button" class="tab" data-tab="gems" aria-pressed="false">
        <svg class="tab-ico tab-gem" viewBox="0 0 24 22" fill="none" aria-hidden="true">
          <path d="M7 1.5H17L22.5 7.5L12 20.5L1.5 7.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M1.5 7.5H22.5M7 1.5L9 7.5L12 20.5L15 7.5L17 1.5" stroke="currentColor" stroke-width="1" stroke-linejoin="round" opacity="0.55"/>
        </svg>
        <span>Gems</span>
      </button>
      <button type="button" class="tab" data-tab="library" aria-pressed="false">
        <svg class="tab-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="6" y="4" width="13" height="17" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M15 10V8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M4 9H8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M4 13H8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M4 17H8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>Library</span>
      </button>
    </nav>

    <div class="toast" id="toast" role="status" hidden></div>

    <section class="slide" id="slide" hidden aria-label="Gem">
      <i class="grab" id="slideGrab"></i>
      <div class="slide-media" id="slideMedia" hidden>
        <div class="slide-photo" id="slidePhoto"></div>
        <div class="slide-scrim" aria-hidden="true"></div>
        <div class="slide-corner" id="slideCorner" hidden></div>
        <div class="slide-overlay" id="slideOverlay">
          <p class="slide-user" id="slideUserOv"></p>
          <h2 id="slideNameOv"></h2>
          <div class="slide-info-row">
            <button type="button" class="like-btn" id="likeBtnOv" aria-label="Like">
              <span class="like-heart" id="likeHeartOv" aria-hidden="true">♡</span>
              <span class="like-count" id="likeCountOv">0</span>
            </button>
          </div>
        </div>
      </div>
      <div class="corner-acts" id="slideActs"></div>
      <div class="slide-head" id="slideHead" hidden>
        <span class="slide-art" id="slideArt"></span>
        <div class="slide-head-copy">
          <h2 id="slideNameHead"></h2>
          <p class="slide-line" id="slideLineHead"></p>
        </div>
      </div>
      <div class="tags" id="slideTags" hidden></div>
      <!-- Prompt = location-gems feed-chip.is-prompt in a swipe strip -->
      <div class="slide-prompt-dock" id="slidePromptDock" hidden>
        <button type="button" class="slide-expand" id="slideExpand" aria-label="[open fuller page]">
          <span aria-hidden="true">↑</span>
        </button>
        <section class="feed-strip slide-prompt-strip" id="slidePromptStrip" aria-label="[nearby prompts]"></section>
      </div>
      <div class="slide-glass" id="slideGlass">
        <p class="slide-user" id="slideUser"></p>
        <h2 id="slideName"></h2>
        <p class="slide-line" id="slideLine"></p>
        <button type="button" class="like-btn" id="likeBtn" aria-label="Like">
          <span class="like-heart" id="likeHeart" aria-hidden="true">♡</span>
          <span class="like-count" id="likeCount">0</span>
        </button>
      </div>
      <p class="sheet-more" id="slideMore" hidden>[tap for more]</p>
      <p class="sheet-status" id="slideStatus" hidden></p>
      <div class="slide-actions" id="slideActions">
        <button type="button" class="icon-act bookmark-btn" id="saveBtn" aria-pressed="false" aria-label="[save for later]"></button>
        <button type="button" class="icon-act hide-btn" id="hideBtn" aria-label="Hide from my map"></button>
        <button type="button" class="nav-btn" id="navBtn">[navigate]</button>
      </div>
    </section>
  </main>

  <p class="meta">GEM-PINS-V2-v50 — Soft disc haze; white all-gem; selected glow.</p>
  <script src="../location-gems/corner-ribbon.js?v=36"></script>
  <script type="module" src="app.js?v=50"></script>
</body>
</html>
