<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Victoria's mockup</title>
<link rel="stylesheet" href="../theme.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .screen {
    width: min(100%, 390px);
    min-height: 100vh;
    padding: 32px 20px;
    background: var(--surface);
    border-top: 8px solid var(--author-victoria);
  }
  h1 { margin: 0 0 8px; font-size: 28px; }
  p { margin: 0; color: var(--text-muted); }
</style>
</head>
<body>
  <main class="screen">
    <h1>Your mockup</h1>
    <p>Replace this screen with the prototype.</p>
  </main>
</body>
</html>
