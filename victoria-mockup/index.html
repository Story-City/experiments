<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Decrypt race</title>
<link rel="stylesheet" href="app.css?v=7">
</head>
<body>
<div class="app">
  <header class="story-bar">
    <button type="button" class="back" aria-label="Back">‹</button>
    <span class="avatar">U</span>
    <span class="sender">Unknown number</span>
  </header>
  <section id="chat" class="chat">
    <div class="thread">
      <p class="bubble">Now let's take a look at the letter.</p>
      <p class="bubble">Did you think we'd make it easy? Unscramble it.</p>
    </div>
    <div class="dock">
      <button type="button" id="decrypt" class="creepy">Decrypt the Letter</button>
    </div>
    <div id="alpha-lady" hidden></div>
  </section>

  <section id="puzzle" class="puzzle" hidden>
    <header class="sheet-bar">
      <button type="button" id="sheet-back" class="back" aria-label="Back">‹</button>
      <h1>Decrypt the Letter</h1>
    </header>
    <p class="instruction">Hit the dot.</p>
    <div class="progress" aria-label="Picture clear"><span id="progress-fill"></span></div>
    <div id="viewport" class="viewport">
      <div id="view" class="view">
        <canvas id="art"></canvas>
        <div id="zones" class="zones"></div>
        <div id="shine" class="shine"></div>
      </div>
    </div>
    <div id="zoom" class="zoom" hidden>
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">−</button>
    </div>
    <button type="button" id="again" class="again" hidden>Again</button>
  </section>
</div>
<script src="app.js?v=7"></script>
</body>
</html>
