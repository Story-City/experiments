<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Balanced stories</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script>
window.CACHE_V = '?v=' + Date.now();
document.write(`<link rel="stylesheet" href="app.css${CACHE_V}">`);
</script>
</head>
<body>
<div class="phone after" id="phone">
  <div class="demo-wrap">
    <div class="demo" role="toolbar" aria-label="Mockup controls">
      <div class="seg" id="storySeg" role="group" aria-label="Story"></div>
      <div class="pager">
        <button type="button" id="prev" aria-label="Previous chapter"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <span id="count">1/6</span>
        <button type="button" id="next" aria-label="Next chapter"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    <div class="demo demo-cast" role="group" aria-label="Layout">
      <div class="seg" id="laySeg"></div>
    </div>
    <div class="demo demo-cast" id="castRow" role="group" aria-label="How characters show">
      <div class="seg" id="castSeg"></div>
      <span class="cast-name" id="castName"></span>
    </div>
  </div>

  <header class="nav">
    <button type="button" class="nav-back" aria-label="Back"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h1 class="nav-title" id="navTitle"></h1>
    <button type="button" class="nav-menu" aria-label="Story menu"><svg viewBox="0 0 24 24" width="24" height="24"><circle cx="5" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="19" cy="12" r="2.2" fill="currentColor"/></svg></button>
  </header>

  <main class="reader" id="reader">
    <div class="content" id="content">
      <div class="featured" id="featured"></div>
      <div class="chapter-name" id="chapterName"></div>
      <div class="webview" id="webview"></div>
      <div class="next-chapters" id="nextChapters"></div>
    </div>
  </main>
</div>
<script type="module">import(`./app.js${window.CACHE_V}`);</script>
</body>
</html>
