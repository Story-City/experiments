<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Day reached — streak overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=17">
<meta http-equiv="Cache-Control" content="no-cache">
</head>
<body>
  <header>
    <h1>Day reached overlay</h1>
    <p class="lede">
      Staging underlays + Training Hub Lottie. No overflow:hidden phone wrapper;
      arc-only side fade; preloaded Lottie; overlay headroom for the bloom.
    </p>
  </header>

  <div class="chips" role="radiogroup" aria-label="Underlay">
    <button type="button" class="chip" data-surface="adventure" aria-pressed="true">Adventure pick</button>
    <button type="button" class="chip" data-surface="audio" aria-pressed="false">Tap to play</button>
    <button type="button" class="chip" data-surface="reader" aria-pressed="false">Reader text</button>
  </div>

  <div class="toolbar">
    <button type="button" class="play" id="play">Play day reached</button>
    <span class="hint" id="hint">Idle — overlay on locked underlay.</span>
  </div>

  <main class="phone" id="phone" data-surface="adventure" aria-label="Day-reached overlay preview">
    <!-- Img rounds itself — no overflow:hidden ancestor (that clipped the Lottie bloom). -->
    <img
      class="underlay"
      id="underlay"
        src="underlays/adventure.jpg?v=17"
      alt="Story City staging — adventure mode picker"
      width="1080"
      height="2400"
      decoding="async"
    >

    <div class="overlay" id="overlay" aria-hidden="true">
      <div class="play-layer" id="playLayer">
        <div class="haze" aria-hidden="true"></div>
        <div class="streak" id="streak">
          <div class="band" id="band">
            <div class="graphic" id="graphic">
              <div class="arc-fade" aria-hidden="true">
                <svg class="arc" id="arc" viewBox="-34 -34 410 242.44921875"></svg>
              </div>
              <div class="beads" id="beads"></div>
              <div class="lottie" id="lottie" aria-hidden="true"></div>
              <div class="copy" id="copy" aria-hidden="true">
                <p class="headline" id="headline"><span class="headline-rich">3-day streak!</span></p>
                <p class="subtitle" id="subtitle">Keep it up!</p>
              </div>
            </div>
          </div>
        </div>
        <div class="shine" id="shine" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <p class="meta">
    Underlays: staging shots. Geometry: <code>feature/SC-3526-training-hub</code>.
  </p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="app.js?v=17"></script>
</body>
</html>
