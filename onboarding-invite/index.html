<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Onboarding · guide on Explore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="place.css?v=7">
</head>
<body data-place="feed">
<!--
  Surface = Story City app Explore (Netflix rows): Featured + horizontal ExploreCards.
  Proportions from ExploreCardStyles (33% × 2:3) + Explore.tsx section order.
  Guide = stolen Summons portal Lottie + FTUE door character.
-->
<main class="phone" id="phone">
  <div class="dbg" role="group" aria-label="Surface">
    <span class="dbg-label">on</span>
    <button type="button" class="dbg-btn" data-place="feed" aria-pressed="true">Explore</button>
    <button type="button" class="dbg-btn" data-place="overview" aria-pressed="false">Story overview</button>
  </div>

  <div class="surface surface-explore" id="surfaceFeed">
    <div class="wash" aria-hidden="true"></div>
    <header class="explore-header">
      <span class="avatar" aria-hidden="true"></span>
      <div class="search"><span>Search</span></div>
    </header>

    <div class="explore-scroll">
      <section class="featured" aria-label="Featured">
        <img src="https://creator.storycity.app/media/6ab6d67bab537_Ep5_Intro-1.jpg" alt="" decoding="async">
        <div class="featured-scrim">
          <p class="featured-title">Tales from the Incident</p>
        </div>
      </section>

      <section class="row" aria-label="Featured Adventure">
        <h2 class="row-heading">Featured Adventure</h2>
        <div class="row-track">
          <a class="explore-card" href="#"><img src="https://creator.storycity.app/media/6ab6d67bab537_Ep5_Intro-1.jpg" alt=""><span>Tales from the Incident</span></a>
          <a class="explore-card" href="#"><img src="https://creator.storycity.app/media/6ad14ddd3f3ee_ftue-door-summons-character.png" alt=""><span>The Summons</span></a>
          <a class="explore-card" href="#"><img src="https://creator.storycity.app/media/6ad14ddaebe6c_ftue-door-knight-character.png" alt=""><span>The Knight's Quest</span></a>
        </div>
      </section>

      <!-- Onboarding invite: portal guide, after Featured / before Continue -->
      <aside class="guide-invite" id="guideInviteFeed" aria-label="Onboarding">
        <button type="button" class="guide-x" data-dismiss aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <div class="guide-stage" aria-hidden="true">
          <div class="guide-portal" id="portalFeed"></div>
          <img class="guide-char"
            src="https://creator.storycity.app/media/6ad14ddd3f3ee_ftue-door-summons-character.png"
            alt="" width="720" height="1000" decoding="async">
        </div>
        <div class="guide-copy">
          <p class="guide-line">Wanna try the onboarding now?</p>
          <div class="guide-actions">
            <a class="guide-cta" href="../first-steps/?v=summons">Try it</a>
          </div>
        </div>
      </aside>

      <section class="row" aria-label="Continue">
        <h2 class="row-heading">Continue</h2>
        <div class="row-track">
          <a class="explore-card" href="#"><img src="../audio-preview/place/tales.jpg" alt=""><span>Tales from the Incident</span></a>
          <a class="explore-card" href="#"><img src="../audio-preview/place/summons.png" alt=""><span>The Summons</span></a>
          <a class="explore-card" href="#"><img src="https://creator.storycity.app/media/6ad14ddaebe6c_ftue-door-knight-character.png" alt=""><span>Knight</span></a>
        </div>
      </section>

      <section class="row" aria-label="Play Anywhere Adventures">
        <h2 class="row-heading">Play Anywhere Adventures</h2>
        <div class="row-track">
          <a class="explore-card" href="#"><img src="https://creator.storycity.app/media/6ab6d67bab537_Ep5_Intro-1.jpg" alt=""><span>Tales</span></a>
          <a class="explore-card" href="#"><img src="../audio-preview/place/summons.png" alt=""><span>Summons</span></a>
          <a class="explore-card" href="#"><img src="https://creator.storycity.app/media/6ad14dde5c08a_ftue-door-summons-prop.png" alt=""><span>Sample</span></a>
        </div>
      </section>
    </div>
  </div>

  <!-- Story overview: audio-preview shell + same guide drop -->
  <div class="surface surface-overview" id="surfaceOverview" hidden>
    <iframe class="overview-frame" title="Story overview" src="../audio-preview/?v=23&amp;c=tales&amp;tip=place"></iframe>
    <aside class="guide-invite guide-invite--drop" id="guideInviteOverview" hidden aria-label="Onboarding">
      <button type="button" class="guide-x" data-dismiss aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="guide-stage" aria-hidden="true">
        <div class="guide-portal" id="portalOverview"></div>
        <img class="guide-char"
          src="https://creator.storycity.app/media/6ad14ddd3f3ee_ftue-door-summons-character.png"
          alt="" width="720" height="1000" decoding="async">
      </div>
      <div class="guide-copy">
        <p class="guide-line">Wanna try the onboarding now?</p>
        <div class="guide-actions">
          <a class="guide-cta" href="../first-steps/?v=summons">Try it</a>
        </div>
      </div>
    </aside>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="app.js?v=7"></script>
</body>
</html>
