<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Story City · Map modes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;700;900&display=swap">
<script>
window.CACHE_V = '?v=' + Date.now();
document.write(`<link rel="stylesheet" href="app.css${CACHE_V}">`);
</script>
</head>
<body>
<div class="phone" id="phone">
  <svg class="map" id="map" viewBox="0 0 390 640" preserveAspectRatio="xMidYMin slice" aria-label="Map of your area"></svg>
  <div class="viewfinder" id="viewfinder" hidden><i></i><i></i><i></i><i></i></div>

  <header class="top">
    <div class="hud" id="hud">
      <span class="chip" id="chip"></span>
      <div class="hud-title" id="hudTitle"></div>
    </div>
    <div class="demo" role="group" aria-label="Mockup controls">
      <button id="noneBtn" aria-pressed="false">No pin nearby</button>
      <button id="resetBtn">Reset</button>
    </div>
  </header>

  <div class="toast" id="toast" hidden></div>

  <section class="card" id="card">
    <div class="story">
      <div class="cover" aria-hidden="true"></div>
      <div>
        <div class="story-name">The Summons · Chapter 2</div>
        <div class="next">Next: <b>the old clock tower</b></div>
      </div>
    </div>
    <div class="switch" id="switch" role="tablist" aria-label="How to unlock this chapter"></div>
    <div class="status" id="status"></div>
    <div class="actions" id="actions"></div>
    <p class="hint">Switch any time. Your steps always count.</p>
  </section>
</div>
<script type="module">import(`./app.js${window.CACHE_V}`);</script>
</body>
</html>
