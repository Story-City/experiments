<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>The Dragon's Name</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="app.css?v=1">
</head>
<body>
<main class="phone">
  <header class="appbar">
    <div class="ch">Dragon research</div>
    <div class="ttl">What is the dragon called?</div>
  </header>

  <section class="screen">
    <figure class="photo">
      <img src="img/dragon-map.jpg" alt="Your saved photo of the dragon's trail">
      <figcaption>Your photo, saved to the research file</figcaption>
    </figure>

    <div id="jumble" hidden>
      <p class="lead">Build the dragon's full name from the tags.</p>
      <div class="slots" id="slots"></div>
      <div class="tray" id="tray"></div>
    </div>

    <div id="entry" hidden>
      <label class="lead" for="name">The dragon's full name</label>
      <input id="name" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="The dragon's full name">
    </div>

    <p class="msg" id="msg" role="status"></p>
    <button class="cta" id="submit" type="button">Complete dragon research</button>
  </section>

  <section class="screen done" id="done" hidden>
    <h2 id="doneName"></h2>
    <p>Research complete. The file now lists the name.</p>
    <button class="ghost" id="again" type="button">Try again</button>
  </section>
</main>
<script src="app.js?v=1"></script>
</body>
</html>
