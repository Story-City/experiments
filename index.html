<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story City Experiments and Polls</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
<link rel="stylesheet" href="theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&display=swap">
<style>
  /* Story City brand (night palette, Erode + Karla). Only this page; theme.css still drives view.html. */
  @font-face { font-family: 'Erode'; src: url(fonts/erode-var-normal.woff2) format('woff2'); font-weight: 300 700; font-style: normal; font-display: swap; size-adjust: 120%; }
  :root, :root:not([x]) {
    color-scheme: dark;
    --ink: #0B0620;
    --midnight: #1A0B3D;
    --velvet: #2A1658;
    --line: #46337E;
    --starlight: #FBF7FF;
    --mist: #D9CEF5;
    --lilac: #A493D6;
    --glow: #C49BFF;
    --bg: var(--midnight);
    --surface: var(--velvet);
    --border: var(--line);
    --text: var(--starlight);
    --text-muted: var(--mist);
    --accent: var(--glow);
    --author-brett: #5B8CFF;    /* sapphire */
    --author-melissa: #DA82ED;  /* kunzite */
    --author-victoria: #00CD9D; /* emerald */
    --author-other: var(--lilac);
    --f-head: 'Erode', Georgia, serif;
    --f-body: 'Karla', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    max-width: 1120px;
    padding: 32px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 var(--f-body);
  }
  html { background: radial-gradient(120% 60% at 50% 0%, #2A1658 0%, var(--midnight) 55%, var(--ink) 100%) fixed var(--ink); }
  body { background: transparent; }
  .kicker { margin: 0 0 6px; font: 700 13px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--glow); }
  h1 { margin: 0 0 6px; font: 600 40px/1.05 var(--f-head); letter-spacing: -.01em; text-wrap: balance; }
  .empty { margin: 0; color: var(--text-muted); }
  h2 { margin: 40px 0 14px; font: 700 13px/1 var(--f-body); text-transform: uppercase; letter-spacing: .1em; color: var(--glow); }
  .sub { margin: 0 0 20px; color: var(--text-muted); }
  /* gallery: 1 across on phones, 2 on tablets, 3 on computers */
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 600px) { ul { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 900px) { ul { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  #archived { gap: 10px; }
  li { --who: var(--author-other); }
  li[data-author="brett"], .chip[data-author="brett"] { --who: var(--author-brett); }
  li[data-author="melissa"], .chip[data-author="melissa"] { --who: var(--author-melissa); }
  li[data-author="victoria"], .chip[data-author="victoria"] { --who: var(--author-victoria); }
  li[hidden] { display: none; }

  /* Experiments | Polls tabs across the top */
  .tabs { display: flex; gap: 4px; margin: 0 0 20px; border-bottom: 1px solid var(--border); }
  .tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 10px 14px; font: 700 18px/1.2 var(--f-body); color: var(--text-muted); cursor: pointer; display: flex; align-items: baseline; gap: 8px; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--glow); }
  .tab:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; border-radius: 6px 6px 0 0; }
  .tab .n { font-size: 13px; font-weight: 500; color: var(--lilac); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; }
  .chip {
    --who: var(--accent);
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    font: 500 14px var(--f-body);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--who); }
  .chip:focus-visible, .cardlink:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  .chip[aria-pressed="true"] {
    border-color: var(--who);
    background: color-mix(in srgb, var(--who) 18%, var(--surface));
    font-weight: 600;
  }

  .cardlink { color: inherit; text-decoration: none; display: block; }
  .links { margin: 8px 0 0; display: flex; gap: 12px; font-size: 13px; }
  .links:empty { display: none; }
  a.ext { color: var(--who); }
  .status {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--who);
  }

  div.card, details.card {
    display: block;
    padding: 16px;
    border: 1px solid var(--border);
    border-left: 4px solid var(--who);
    border-radius: 12px;
    background: var(--surface);
    color: inherit;
    text-decoration: none;
  }
  div.card { height: 100%; padding: 0; overflow: hidden; border-left-width: 1px; border-top: 4px solid var(--who); display: flex; flex-direction: column; transition: border-color .15s, transform .15s; }
  div.card:hover, div.card:focus-within { border-color: var(--who); transform: translateY(-2px); box-shadow: 0 10px 30px -12px color-mix(in srgb, var(--who) 55%, transparent); }
  div.card .cardlink { flex: 1; display: flex; flex-direction: column; }
  /* the description and date sit at the bottom; the title is centred in the space above them */
  .body { flex: 1; display: flex; flex-direction: column; padding: 18px 18px 16px; }
  .body .name { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 3.3em; padding: 4px 0 12px; }
  div.card .links { padding: 0 16px 14px; margin: 0; }
  .body .what { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: 15px; }
  .name { font: 600 28px/1.1 var(--f-head); text-wrap: balance; }
  .what { margin: 4px 0 0; color: var(--text-muted); }
  .meta { margin: 8px 0 0; font-size: 13px; color: var(--lilac); }
  .by { color: var(--who); font-weight: 600; }

  details.card { padding: 10px 16px; opacity: .75; }
  details.card[open] { opacity: 1; padding-bottom: 16px; }
  details.card summary { cursor: pointer; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  details.card summary .name { font-size: 21px; }
  details.card a { color: var(--who); }
  .status.draft { display: inline-block; white-space: nowrap; border-color: var(--glow); color: var(--glow); }
  /* "live": once a feature ships, its card shows a little snippet of the real app (screenshot or short looping clip) */
  .snippet { position: relative; display: flex; justify-content: center; gap: 10px; padding: 48px 16px 0; background: linear-gradient(180deg, color-mix(in srgb, var(--who) 22%, var(--ink)), transparent); }
  .snippet .shot { width: 96px; aspect-ratio: 9 / 19.5; border-radius: 16px; border: 3px solid #0d0a1c; box-shadow: 0 0 0 1px var(--border), 0 12px 24px -10px rgba(0,0,0,.6); overflow: hidden; background: var(--ink); }
  .snippet .shot img, .snippet .shot video { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .badge-live { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px; background: var(--ink); color: #3ddc84; border: 1px solid color-mix(in srgb, #3ddc84 55%, transparent); }
  .badge-live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 6px #3ddc84; }
  .live-note { margin: 6px 0 0; font-size: 13px; color: #8fe8b5; }
  /* Experiments grouped by part of the app ("area" in experiments.json), in the order a player meets them */
  .area-nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px; }
  .area-nav a { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-muted); font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .area-nav a[hidden], .area[hidden] { display: none; }
  .area-nav a:hover { border-color: var(--glow); color: var(--text); }
  .area-nav a span, .area-h span { color: var(--lilac); font-weight: 400; }
  .area { scroll-margin-top: 16px; }
  .area-h { margin: 36px 0 14px; font: 600 24px/1.1 var(--f-head); text-transform: none; letter-spacing: 0; color: var(--text); }
  .area-h span { font: 400 14px var(--f-body); margin-left: 6px; }
  .tag {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--lilac);
  }
</style>
</head>
<body>
<p class="kicker">Story City</p>
<h1>Experiments and polls</h1>
<p class="sub">Throwaway prototypes for playtests, and team polls. Open them on a phone.</p>
<div class="tabs" role="tablist" aria-label="Section">
  <button class="tab" type="button" role="tab" id="tab-experiments" data-tab="experiments" aria-controls="panel-experiments" aria-selected="true">Experiments <span class="n" id="n-experiments"></span></button>
  <button class="tab" type="button" role="tab" id="tab-polls" data-tab="polls" aria-controls="panel-polls" aria-selected="false" tabindex="-1">Polls <span class="n" id="n-polls"></span></button>
  <button class="tab" type="button" role="tab" id="tab-drafts" data-tab="drafts" aria-controls="panel-drafts" aria-selected="false" tabindex="-1">Drafts <span class="n" id="n-drafts"></span></button>
</div>
<div class="filters" role="group" aria-label="Filter by author"></div>

<section id="panel-experiments" role="tabpanel" aria-labelledby="tab-experiments">
<nav class="area-nav" id="area-nav" aria-label="Parts of the app"></nav>
<div id="live"></div>

<h2 id="archived-heading">Archived</h2>
<ul id="archived"></ul>
</section>

<section id="panel-polls" role="tabpanel" aria-labelledby="tab-polls" hidden>
<ul id="polls"></ul>
<p class="empty" id="polls-empty" hidden>No polls from this person yet.</p>
</section>

<section id="panel-drafts" role="tabpanel" aria-labelledby="tab-drafts" hidden>
<p class="sub">New experiments wait here until the person who asked for them approves.</p>
<ul id="drafts"></ul>
<p class="empty" id="drafts-empty" hidden>No drafts from this person.</p>
</section>

<script type="module">
  import * as store from './hub/store.js';

  const [manifest, notion] = await Promise.all([
    store.loadJson('experiments.json'),
    store.loadJson('hub/notion.json'),
  ]);
  const entries = manifest || [];
  const tasks = notion?.tasks || {};
  const month = d => new Date(d + '-01T00:00').toLocaleDateString('en', { month: 'long', year: 'numeric' });
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const link = (href, text) => {
    const a = el('a', 'ext', text);
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener';
    return a;
  };
  const viewUrl = e => `view.html?e=${encodeURIComponent(e.slug)}`;

  function meta(e) {
    const p = el('p', 'meta');
    p.append(el('span', 'by', e.authorName), ` · ${month(e.date)}`);
    const t = tasks[e.slug];
    if (t?.status) {
      const s = el('span', 'status', t.status);
      p.append(' · ', s);
    }
    if (e.draft) p.append(' · ', el('span', 'status draft', `Draft · waiting for ${e.reviewer || 'review'}`));
    const count = el('span', 'count');
    count.dataset.slug = e.slug;
    p.append(count);
    return p;
  }

  function links(e) {
    const row = el('p', 'links');
    if (e.notionPageId) row.append(link(`https://app.notion.com/p/storycity/${e.notionPageId.replace(/-/g, '')}`, 'Notion'));
    if (e.jira) row.append(link(`https://storycity.atlassian.net/browse/${e.jira}`, e.jira));
    return row;
  }

  // live: { since: 'YYYY-MM', shots: ['slug/live/1.png' or '.mp4'], note: 'what shipped' }; up to 2 snippets
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function snippet(live) {
    const box = el('div', 'snippet');
    box.append(el('span', 'badge-live', live.since ? `Live in the app · ${month(live.since).split(' ')[0]}` : 'Live in the app'));
    for (const src of (live.shots || []).slice(0, 2)) {
      const frame = el('div', 'shot');
      if (/\.(mp4|webm)$/i.test(src)) {
        const v = el('video');
        Object.assign(v, { src, muted: true, loop: true, playsInline: true, autoplay: !reduceMotion, preload: 'metadata' });
        v.setAttribute('aria-hidden', 'true');
        frame.append(v);
      } else {
        const img = el('img');
        Object.assign(img, { src, alt: '', loading: 'lazy' });
        frame.append(img);
      }
      box.append(frame);
    }
    return box;
  }

  function card(e) {
    const li = el('li');
    li.dataset.author = e.author;
    li.dataset.authorName = e.authorName;
    li.dataset.area = AREAS.some(([id]) => id === e.area) ? e.area : 'other';
    if (e.archived) {
      const d = el('details', 'card');
      const sum = el('summary');
      sum.append(el('span', 'name', e.title), el('span', 'tag', 'Archived'));
      const open = el('a', null, 'Open it');
      open.href = viewUrl(e);
      const m = meta(e);
      m.append(' · ', open);
      d.append(sum, el('p', 'what', e.what), m, links(e));
      li.append(d);
    } else {
      const wrap = el('div', 'card');
      const a = el('a', 'cardlink');
      a.href = viewUrl(e);
      const body = el('div', 'body');
      body.append(el('div', 'name', e.title), el('p', 'what', e.what));
      if (e.live?.note) body.append(el('p', 'live-note', e.live.note));
      body.append(meta(e));
      if (e.live) a.append(snippet(e.live));
      a.append(body);
      wrap.append(a, links(e));
      li.append(wrap);
    }
    return li;
  }

  // Parts of the app, in the order a player meets them. An entry's "area" picks its group; no area = Other.
  const AREAS = [
    ['first', 'First-time experience'],
    ['finding', 'Finding a story'],
    ['reading', 'Reading a story'],
    ['puzzles', 'Puzzles & story tools'],
    ['map', 'Map & walking'],
    ['gems', 'Gems & rewards'],
    ['together', 'Playing together'],
    ['outside', 'Outside the app'],
    ['design', 'Design system'],
    ['other', 'Other'],
  ];
  const liveWrap = document.getElementById('live');
  const areaNav = document.getElementById('area-nav');
  const areaList = {};
  for (const [id, label] of AREAS) {
    const sec = el('section', 'area');
    sec.id = `area-${id}`;
    sec.dataset.area = id;
    const h = el('h2', 'area-h', label);
    h.append(el('span', 'n'));
    areaList[id] = el('ul');
    sec.append(h, areaList[id]);
    liveWrap.append(sec);
    const a = el('a', null, label);
    a.href = `#area-${id}`;
    a.dataset.area = id;
    a.append(el('span', 'n'));
    areaNav.append(a);
  }
  const live = { append: (li) => (areaList[li.dataset.area] || areaList.other).append(li) };
  const polls = document.getElementById('polls');
  const archived = document.getElementById('archived');
  const drafts = document.getElementById('drafts');
  // "draft": true keeps a new experiment in the Drafts tab until its reviewer approves (then delete draft + reviewer)
  for (const e of entries) (e.archived ? archived : e.draft ? drafts : e.category === 'poll' ? polls : live).append(card(e));

  const items = [...document.querySelectorAll('li[data-author]')];
  const authors = new Map();
  for (const li of items) authors.set(li.dataset.author, li.dataset.authorName);

  const bar = document.querySelector('.filters');
  const chips = [['', 'Everyone'], ...authors].map(([key, label]) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.textContent = label;
    if (key) b.dataset.author = key;
    b.addEventListener('click', () => apply(key));
    bar.append(b);
    return b;
  });

  function apply(key) {
    if (key && !authors.has(key)) key = '';
    for (const b of chips) b.setAttribute('aria-pressed', String((b.dataset.author || '') === key));
    for (const li of items) li.hidden = !!key && li.dataset.author !== key;
    document.getElementById('archived-heading').hidden =
      ![...document.querySelectorAll('#archived li')].some(li => !li.hidden);
    document.getElementById('n-experiments').textContent = [...document.querySelectorAll('#live li')].filter(li => !li.hidden).length;
    // hide parts of the app with nothing to show (for this person)
    for (const sec of document.querySelectorAll('#live .area')) {
      const n = [...sec.querySelectorAll('li')].filter(li => !li.hidden).length;
      sec.hidden = !n;
      sec.querySelector('.area-h .n').textContent = n;
      const a = areaNav.querySelector(`a[data-area="${sec.dataset.area}"]`);
      a.hidden = !n;
      a.querySelector('.n').textContent = n;
    }
    const pollCount = [...document.querySelectorAll('#polls li')].filter(li => !li.hidden).length;
    document.getElementById('n-polls').textContent = pollCount;
    document.getElementById('polls-empty').hidden = pollCount > 0;
    const draftCount = [...document.querySelectorAll('#drafts li')].filter(li => !li.hidden).length;
    document.getElementById('n-drafts').textContent = draftCount;
    document.getElementById('drafts-empty').hidden = draftCount > 0;
    const url = new URL(location.href);
    key ? url.searchParams.set('by', key) : url.searchParams.delete('by');
    history.replaceState(null, '', url);
  }

  apply(new URLSearchParams(location.search).get('by') || '');

  // Experiments | Polls tabs; ?tab=polls opens Polls
  const tabs = [...document.querySelectorAll('.tab')];
  function show(name, focus) {
    if (!tabs.some(b => b.dataset.tab === name)) name = 'experiments';
    for (const b of tabs) {
      const on = b.dataset.tab === name;
      b.setAttribute('aria-selected', String(on));
      b.tabIndex = on ? 0 : -1;
      document.getElementById(b.getAttribute('aria-controls')).hidden = !on;
      if (on && focus) b.focus();
    }
    const url = new URL(location.href);
    name !== 'experiments' ? url.searchParams.set('tab', name) : url.searchParams.delete('tab');
    history.replaceState(null, '', url);
  }
  for (const b of tabs) {
    b.addEventListener('click', () => show(b.dataset.tab));
    b.addEventListener('keydown', ev => {
      if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
      const i = (tabs.indexOf(b) + (ev.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
      show(tabs[i].dataset.tab, true);
    });
  }
  show(new URLSearchParams(location.search).get('tab') || 'experiments');

  try {
    const ctx = await store.init();
    if (ctx.enabled) {
      store.watchComments(null, comments => {
        const n = {};
        for (const c of comments) if (!c.parentId) n[c.slug] = (n[c.slug] || 0) + 1;
        for (const s of document.querySelectorAll('.count')) {
          const k = n[s.dataset.slug] || 0;
          s.textContent = k ? ` · ${k} open comment${k === 1 ? '' : 's'}` : '';
        }
      });
    }
  } catch {}
</script>
</body>
</html>
