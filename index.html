<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story City Experiments</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    max-width: 640px;
    padding: 32px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { margin: 0 0 4px; font-size: 26px; }
  h2 { margin: 32px 0 12px; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
  .sub { margin: 0 0 16px; color: var(--text-muted); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  li { --who: var(--author-other); }
  li[data-author="brett"], .chip[data-author="brett"] { --who: var(--author-brett); }
  li[data-author="melissa"], .chip[data-author="melissa"] { --who: var(--author-melissa); }
  li[hidden] { display: none; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; }
  .chip {
    --who: var(--accent);
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    border-color: var(--who);
    background: color-mix(in srgb, var(--who) 18%, var(--surface));
    font-weight: 600;
  }

  .cardlink { color: inherit; text-decoration: none; display: block; }
  .links { margin: 8px 0 0; display: flex; gap: 12px; font-size: 13px; }
  .links:empty { display: none; }
  a.ext { color: var(--who); }
  .status {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--who);
  }

  div.card, details.card {
    display: block;
    padding: 16px;
    border: 1px solid var(--border);
    border-left: 4px solid var(--who);
    border-radius: 16px;
    background: var(--surface);
    color: inherit;
    text-decoration: none;
  }
  div.card:hover, div.card:focus-within { border-color: var(--who); }
  .name { font-weight: 600; font-size: 18px; }
  .what { margin: 4px 0 0; color: var(--text-muted); }
  .meta { margin: 6px 0 0; font-size: 13px; color: var(--text-muted); }
  .by { color: var(--who); font-weight: 600; }

  details.card { padding: 10px 16px; opacity: .75; }
  details.card[open] { opacity: 1; padding-bottom: 16px; }
  details.card summary { cursor: pointer; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  details.card summary .name { font-size: 15px; }
  details.card a { color: var(--who); }
  .tag {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }
</style>
</head>
<body>
<h1>Story City Experiments</h1>
<p class="sub">Throwaway prototypes for playtests. Open them on a phone.</p>
<div class="filters" role="group" aria-label="Filter by author"></div>

<ul id="live"></ul>

<h2 id="archived-heading">Archived</h2>
<ul id="archived"></ul>

<script type="module">
  import * as store from './hub/store.js';

  const [manifest, notion] = await Promise.all([
    store.loadJson('experiments.json'),
    store.loadJson('hub/notion.json'),
  ]);
  const entries = manifest || [];
  const tasks = notion?.tasks || {};
  const month = d => new Date(d + '-01T00:00').toLocaleDateString('en', { month: 'long', year: 'numeric' });
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const link = (href, text) => {
    const a = el('a', 'ext', text);
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener';
    return a;
  };
  const viewUrl = e => `view.html?e=${encodeURIComponent(e.slug)}`;

  function meta(e) {
    const p = el('p', 'meta');
    p.append(el('span', 'by', e.authorName), ` · ${month(e.date)}`);
    const t = tasks[e.slug];
    if (t?.status) {
      const s = el('span', 'status', t.status);
      p.append(' · ', s);
    }
    const count = el('span', 'count');
    count.dataset.slug = e.slug;
    p.append(count);
    return p;
  }

  function links(e) {
    const row = el('p', 'links');
    if (e.notionPageId) row.append(link(`https://app.notion.com/p/storycity/${e.notionPageId.replace(/-/g, '')}`, 'Notion'));
    if (e.jira) row.append(link(`https://storycity.atlassian.net/browse/${e.jira}`, e.jira));
    return row;
  }

  function card(e) {
    const li = el('li');
    li.dataset.author = e.author;
    li.dataset.authorName = e.authorName;
    if (e.archived) {
      const d = el('details', 'card');
      const sum = el('summary');
      sum.append(el('span', 'name', e.title), el('span', 'tag', 'Archived'));
      const open = el('a', null, 'Open it');
      open.href = viewUrl(e);
      const m = meta(e);
      m.append(' · ', open);
      d.append(sum, el('p', 'what', e.what), m, links(e));
      li.append(d);
    } else {
      const wrap = el('div', 'card');
      const a = el('a', 'cardlink');
      a.href = viewUrl(e);
      a.append(el('div', 'name', e.title), el('p', 'what', e.what), meta(e));
      wrap.append(a, links(e));
      li.append(wrap);
    }
    return li;
  }

  const live = document.getElementById('live');
  const archived = document.getElementById('archived');
  for (const e of entries) (e.archived ? archived : live).append(card(e));

  const items = [...document.querySelectorAll('li[data-author]')];
  const authors = new Map();
  for (const li of items) authors.set(li.dataset.author, li.dataset.authorName);

  const bar = document.querySelector('.filters');
  const chips = [['', 'Everyone'], ...authors].map(([key, label]) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.textContent = label;
    if (key) b.dataset.author = key;
    b.addEventListener('click', () => apply(key));
    bar.append(b);
    return b;
  });

  function apply(key) {
    if (key && !authors.has(key)) key = '';
    for (const b of chips) b.setAttribute('aria-pressed', String((b.dataset.author || '') === key));
    for (const li of items) li.hidden = !!key && li.dataset.author !== key;
    document.getElementById('archived-heading').hidden =
      ![...document.querySelectorAll('#archived li')].some(li => !li.hidden);
    const url = new URL(location.href);
    key ? url.searchParams.set('by', key) : url.searchParams.delete('by');
    history.replaceState(null, '', url);
  }

  apply(new URLSearchParams(location.search).get('by') || '');

  try {
    const ctx = await store.init();
    if (ctx.enabled) {
      store.watchComments(null, comments => {
        const n = {};
        for (const c of comments) if (!c.parentId) n[c.slug] = (n[c.slug] || 0) + 1;
        for (const s of document.querySelectorAll('.count')) {
          const k = n[s.dataset.slug] || 0;
          s.textContent = k ? ` · ${k} open comment${k === 1 ? '' : 's'}` : '';
        }
      });
    }
  } catch {}
</script>
</body>
</html>
