<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gem map pins V3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;700;800;900&display=swap">
<link rel="stylesheet" href="app.css?v=62">
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="stylesheet" href="../shared/gem-tabbar/tabbar.css?v=5">
<link rel="stylesheet" href="../shared/gem-hub-rail/rail.css?v=1">
</head>
<body>
  <header class="page-head">
    <p class="eyebrow">StoryCity · experiments</p>
    <h1>Gem map pins V3</h1>
    <p class="lede">Melissa’s map, Victoria’s gems. Options are in the panel on the right.</p>
  </header>

  <div class="gh-workspace">

  <main class="phone" id="phone">
    <div class="screen" id="screen">
      <div class="map" id="map"></div>
      <div class="pins" id="pins"></div>
    </div>

    <header class="map-top">
      <div class="gbox" id="filterGbox">
        <div class="map-bar" id="mapBar">
          <div class="nearby-row" id="nearbyRow">
            <span class="nearby-ico" id="nearbyIco" aria-hidden="true"></span>
            <p class="nearby-title" id="nearbyTitle">Gems nearby</p>
          </div>
          <div class="legend" id="legend" hidden></div>
          <div class="top-roller-slot" id="topRollerSlot">
            <div class="roller-wrap" id="rollerWrap">
              <div class="roller" id="roller" role="listbox" aria-label="Filter gems"></div>
            </div>
          </div>
          <div class="disc-stage" id="discStage" hidden>
            <svg class="disc-arc" id="discArc" viewBox="0 0 400 100" preserveAspectRatio="none" aria-hidden="true">
              <!-- Soft mid glow + thin tint; long mask fade avoids a hard cut on the bloom -->
              <path
                class="disc-arc-glow"
                d="M 68 36 Q 200 112 332 36"
                fill="none"
                stroke="currentColor"
                stroke-width="5"
                stroke-linecap="round"
                opacity="0.22"
              />
              <path
                class="disc-arc-tint"
                d="M 68 36 Q 200 112 332 36"
                fill="none"
                stroke="currentColor"
                stroke-width="2.25"
                stroke-linecap="round"
                opacity="0.92"
              />
            </svg>
            <div class="disc-wheel" id="discWheel" role="listbox" aria-label="Filter gems on disc"></div>
            <div class="disc-caption" id="discCaption">
              <p class="disc-title" id="discTitle"></p>
              <p class="disc-note" id="discNote"></p>
            </div>
          </div>
          <button type="button" class="filter-btn" id="filterBtn" aria-pressed="false" aria-label="Filter">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"/></svg>
          </button>
        </div>
      </div>
    </header>
    <!-- Quarter haze (Melissa, 26 Nov): Disc haze 2 glow on a true quarter circle in the top-right corner -->
    <div class="quarter-wrap" id="quarterWrap" hidden>
      <div class="quarter-caption">
        <p class="disc-title" id="quarterTitle"></p>
        <p class="disc-note" id="quarterNote"></p>
      </div>
      <div class="quarter-stage" id="quarterStage">
        <svg class="quarter-arc" id="quarterArc" viewBox="0 0 200 200" aria-hidden="true">
          <path class="disc-arc-glow" d="M 50 0 A 150 150 0 0 0 200 150" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
          <path class="disc-arc-tint" d="M 50 0 A 150 150 0 0 0 200 150" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div class="disc-wheel" id="quarterWheel" role="listbox" aria-label="Filter gems on the corner arc"></div>
      </div>
    </div>
    <!-- Corner = same disc arc rotated into top-left (Figma); Disc colour untouched -->
    <div class="corner-disc-wrap" id="cornerDiscWrap" hidden>
      <div class="corner-disc-caption">
        <p class="disc-title" id="cornerDiscTitle"></p>
        <p class="disc-note" id="cornerDiscNote"></p>
      </div>
      <div class="corner-disc-stage" id="cornerDiscStage">
        <svg class="disc-arc" id="cornerDiscArc" viewBox="0 0 400 100" preserveAspectRatio="none" aria-hidden="true">
          <path
            class="disc-arc-glow"
            d="M 68 36 Q 200 112 332 36"
            fill="none"
            stroke="currentColor"
            stroke-width="5"
            stroke-linecap="round"
            opacity="0.22"
          />
          <path
            class="disc-arc-tint"
            d="M 68 36 Q 200 112 332 36"
            fill="none"
            stroke="currentColor"
            stroke-width="2.25"
            stroke-linecap="round"
            opacity="0.92"
          />
        </svg>
        <div class="disc-wheel" id="cornerDiscWheel" role="listbox" aria-label="Filter gems on corner disc"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>

    <section class="slide" id="slide" hidden aria-label="Gem">
      <i class="grab" id="slideGrab"></i>
      <div class="slide-media" id="slideMedia" hidden>
        <div class="slide-photo" id="slidePhoto"></div>
        <div class="slide-scrim" aria-hidden="true"></div>
        <div class="slide-corner" id="slideCorner" hidden></div>
        <div class="slide-overlay" id="slideOverlay">
          <p class="slide-user" id="slideUserOv"></p>
          <h2 id="slideNameOv"></h2>
          <div class="slide-info-row">
            <button type="button" class="like-btn" id="likeBtnOv" aria-label="Like">
              <span class="like-heart" id="likeHeartOv" aria-hidden="true">♡</span>
              <span class="like-count" id="likeCountOv">0</span>
            </button>
          </div>
        </div>
      </div>
      <div class="corner-acts" id="slideActs"></div>
      <div class="slide-head" id="slideHead" hidden>
        <span class="slide-art" id="slideArt"></span>
        <div class="slide-head-copy">
          <h2 id="slideNameHead"></h2>
          <p class="slide-line" id="slideLineHead"></p>
        </div>
      </div>
      <div class="tags" id="slideTags" hidden></div>
      <!-- Prompt = location-gems feed-chip.is-prompt in a swipe strip -->
      <div class="slide-prompt-dock" id="slidePromptDock" hidden>
        <button type="button" class="slide-expand" id="slideExpand" aria-label="[open fuller page]">
          <span aria-hidden="true">↑</span>
        </button>
        <section class="feed-strip slide-prompt-strip" id="slidePromptStrip" aria-label="[nearby prompts]"></section>
      </div>
      <div class="slide-glass" id="slideGlass">
        <p class="slide-user" id="slideUser"></p>
        <h2 id="slideName"></h2>
        <p class="slide-line" id="slideLine"></p>
        <button type="button" class="like-btn" id="likeBtn" aria-label="Like">
          <span class="like-heart" id="likeHeart" aria-hidden="true">♡</span>
          <span class="like-count" id="likeCount">0</span>
        </button>
      </div>
      <p class="sheet-more" id="slideMore" hidden>[tap for more]</p>
      <p class="sheet-status" id="slideStatus" hidden></p>
      <div class="slide-actions" id="slideActions">
        <button type="button" class="nav-btn" id="navBtn">[navigate]</button>
        <button type="button" class="icon-act bookmark-btn" id="saveBtn" aria-pressed="false" aria-label="[save for later]"></button>
        <button type="button" class="icon-act hide-btn" id="hideBtn" aria-label="Hide from my map"></button>
        <button type="button" class="icon-act visit-btn" id="visitBtn" aria-pressed="false" aria-label="Mark visited"></button>
      </div>
    </section>
  </main>
  <!-- Options in Victoria's Gem Hub rail style (shared/gem-hub-rail) -->
  <aside class="gh-rail" aria-label="Options">
    <section class="gh-block">
      <h2 class="gh-title">Slide-out</h2>
      <div class="gh-pick" id="sheetSwitch" role="group" aria-label="Slide-out version">
        <button type="button" data-sheet="original" aria-pressed="false">Original</button>
        <button type="button" data-sheet="prompt" aria-pressed="false">Text</button>
        <button type="button" data-sheet="prompt-glow" aria-pressed="false">Text glow</button>
        <button type="button" data-sheet="image" aria-pressed="false">Image</button>
        <button type="button" data-sheet="bar" aria-pressed="false">Bar</button>
      </div>
    </section>
    <section class="gh-block">
      <h2 class="gh-title">Filter layout</h2>
      <div class="gh-pick" id="layoutSwitch" role="group" aria-label="Filter layout">
        <button type="button" data-filter-layout="always" aria-pressed="true">Always on</button>
        <button type="button" data-filter-layout="classic" aria-pressed="false">Classic top</button>
        <button type="button" data-filter-layout="inline" aria-pressed="false">Inline legend</button>
        <button type="button" data-filter-layout="disc" aria-pressed="false">Disc colour</button>
        <button type="button" data-filter-layout="disc-haze" aria-pressed="false">Disc haze</button>
        <button type="button" data-filter-layout="disc-haze-2" aria-pressed="false">Disc haze 2</button>
        <button type="button" data-filter-layout="quarter-haze" aria-pressed="false">Quarter haze</button>
        <button type="button" data-filter-layout="corner" aria-pressed="false">Corner</button>
      </div>
      <p class="gh-note">[more filter layout patterns]</p>
    </section>
    <section class="gh-block">
      <h2 class="gh-title">Create button</h2>
      <div class="gh-pick" role="group" aria-label="Create button">
        <button type="button" data-create-look="plus" aria-pressed="false">Plus</button>
        <button type="button" data-create-look="capture" aria-pressed="false">Capture</button>
        <button type="button" data-create-look="subtle" aria-pressed="false">Subtle</button>
        <button type="button" data-create-look="camera" aria-pressed="false">Camera</button>
        <button type="button" data-create-look="hunt" aria-pressed="false">Hunt</button>
      </div>
    </section>
    <section class="gh-block">
      <h2 class="gh-title">Bottom bar</h2>
      <div class="gh-pick" role="group" aria-label="Tab titles">
        <button type="button" data-tab-labels="on" aria-pressed="false">Titles</button>
        <button type="button" data-tab-labels="off" aria-pressed="false">Icons only</button>
      </div>
      <div class="gh-pick" role="group" aria-label="Bar width">
        <button type="button" data-tab-width="compact" aria-pressed="false">Compact</button>
        <button type="button" data-tab-width="spread" aria-pressed="false">Spread</button>
      </div>
      <div class="gh-pick is-3" role="group" aria-label="Bar shape">
        <button type="button" data-tab-shape="float" aria-pressed="false">Floating</button>
        <button type="button" data-tab-shape="tab" aria-pressed="false">Tab</button>
        <button type="button" data-tab-shape="full" aria-pressed="false">Full</button>
      </div>
    </section>
  </aside>
  </div>

  <p class="meta">GEM-PINS-V2-v49 — Disc haze = soft Disc colour; white map gems.</p>
  <script src="../location-gems/corner-ribbon.js?v=36"></script>
  <script type="module" src="app.js?v=57"></script>
  <!-- The one bottom bar every Gem map pins version uses: shared/gem-tabbar -->
  <script src="../shared/gem-tabbar/tabbar.js?v=5"></script>
  <script>
  GemTabBar.mount({
    host: document.getElementById('phone'),
    active: 'map',
    onGems() {
      if (window.parent !== window) window.parent.postMessage({ type: 'gem-pins-open-gems' }, '*');
      else location.href = '../location-gems/?v=112&appPages=1';
    },
  });
  [['createLook', 'getCreateLook', 'setCreateLook'], ['tabLabels', 'getLabels', 'setLabels'], ['tabWidth', 'getWidth', 'setWidth'], ['tabShape', 'getShape', 'setShape']].forEach(([data, get, set]) => {
    const btns = document.querySelectorAll('.gh-rail [data-' + data.replace(/[A-Z]/g, (c) => '-' + c.toLowerCase()) + ']');
    const paint = () => btns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset[data] === GemTabBar[get]())));
    btns.forEach((b) => b.addEventListener('click', () => { GemTabBar[set](b.dataset[data]); paint(); }));
    window.addEventListener('storage', paint);
    paint();
  });
  </script>
</body>
</html>
