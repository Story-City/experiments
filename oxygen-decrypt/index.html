<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Decrypt the Artwork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=3">
</head>
<body>
<main class="phone">
  <section id="reader" class="screen reader" aria-label="Reader">
    <img class="frame" src="assets/screen-reader.png" alt="Reader chapter with Decrypt the Artwork ticket" width="375" height="743">
    <button type="button" id="open-puzzle" class="hotspot ticket" aria-label="Decrypt the Artwork"></button>
  </section>

  <section id="puzzle" class="screen puzzle" hidden aria-label="Decrypt the Puzzle">
    <img class="frame" src="assets/screen-puzzle.png" alt="Decrypt the Puzzle colour picker" width="375" height="743">
    <button type="button" id="close-puzzle" class="hotspot dismiss" aria-label="Close puzzle"></button>
    <div role="radiogroup" aria-label="Pick a colour">
      <button type="button" class="swatch" data-color="red" aria-checked="true" aria-label="Red"></button>
      <button type="button" class="swatch" data-color="cream" aria-checked="false" aria-label="Cream"></button>
      <button type="button" class="swatch" data-color="charcoal" aria-checked="false" aria-label="Charcoal"></button>
    </div>
    <button type="button" id="select-colour" class="hotspot select" aria-label="Select colour"></button>
    <p id="status" class="status" hidden>Colour locked. Snap something nearby that matches.</p>
  </section>
</main>
<script src="app.js?v=3"></script>
</body>
</html>
