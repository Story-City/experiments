<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Everyday Story City</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path d=%22M12 0c.9 6.6 4.9 10.8 12 12-7.1 1.2-11.1 5.4-12 12-.9-6.6-4.9-10.8-12-12C7.1 10.8 11.1 6.6 12 0z%22 fill=%22%23C49BFF%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400..800;1,400..800&family=Barlow:wght@400;600;700&family=Darker+Grotesque:wght@400;700&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="tune.css">
</head>
<body>
<div class="rig" id="rig" role="toolbar" aria-label="Mockup tools"></div>
<div class="phone" id="phone">
  <main id="screen" class="scr"></main>
  <div id="pill" class="pillslot"></div>
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
  <button class="fixback" id="fixback" data-act="fixBack" hidden></button>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
</div>
<script type="module" src="app.js"></script>
<script type="module" src="tune.js"></script>
</body>
</html>
