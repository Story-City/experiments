<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Story City · Narrated reader</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;600;700;900&display=swap">
<script>
window.CACHE_V = '?v=' + Date.now();
document.write(`<link rel="stylesheet" href="app.css${CACHE_V}">`);
</script>
</head>
<body>
<div class="phone" id="phone">

  <!-- Start screen: pick a variant, then play -->
  <section class="start" id="start">
    <div class="start-art" id="startArt" aria-hidden="true"></div>
    <div class="start-body">
      <div class="kicker" id="startKind">Narrated story</div>
      <h1 id="startTitle"></h1>
      <p class="start-ch" id="startChapter"></p>
      <button class="go" id="startBtn">Start chapter</button>
      <div class="ab" role="group" aria-label="Mockup variant">
        <span>Mockup:</span>
        <button data-v="synced">Synced</button>
        <button data-v="text">Text story</button>
        <button data-v="captions">Captions</button>
      </div>
    </div>
  </section>

  <!-- Reader -->
  <section class="reader" id="reader" hidden>
    <header class="top">
      <button class="icon back" id="backBtn" aria-label="Back to start">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="top-title">
        <b id="topTitle"></b>
        <span id="topChapter"></span>
      </div>
      <label class="aloud" id="aloudWrap" title="Read aloud with the phone's voice">
        <input type="checkbox" id="aloud"> <span>Read aloud</span>
      </label>
    </header>

    <div class="scene" id="scene" hidden aria-hidden="true"></div>
    <div class="thread" id="thread" aria-live="polite"></div>
    <div class="captions" id="captions" hidden aria-live="polite"></div>

    <button class="nowpill" id="nowBtn" hidden>
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg> Back to now
    </button>

    <div class="choices" id="choices" hidden></div>

    <footer class="audio" id="audio">
      <button class="play" id="playBtn" aria-label="Pause">
        <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="track">
        <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Position in chapter">
        <div class="times"><span id="tNow">0:00</span><span id="tEnd">0:00</span></div>
      </div>
      <button class="speed" id="speedBtn" aria-label="Playback speed">1×</button>
    </footer>
  </section>
</div>
<script type="module">import(`./app.js${window.CACHE_V}`);</script>
</body>
</html>
