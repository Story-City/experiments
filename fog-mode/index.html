<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Story City · Fog mode</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌫️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Darker+Grotesque:wght@500;700;900&display=swap">
<script>
window.CACHE_V = '?v=' + Date.now();
document.write(`<link rel="stylesheet" href="app.css${CACHE_V}">`);
</script>
</head>
<body>
<div class="phone" id="phone">
  <svg class="map" id="map" viewBox="0 0 390 640" preserveAspectRatio="xMidYMin slice" aria-label="Map of your area"></svg>
  <canvas class="fog" id="fog" aria-hidden="true"></canvas>
  <svg class="map overlay" id="overlay" viewBox="0 0 390 640" preserveAspectRatio="xMidYMin slice" aria-hidden="true"></svg>
  <div class="viewfinder" id="viewfinder" hidden><i></i><i></i><i></i><i></i></div>

  <!-- Laid out like the app's chapter map (mobile-rn FtueMap): back to the story, the title, then the map -->
  <header class="top app-top">
    <div class="appbar">
      <button class="back" type="button" aria-label="Back to the story">
        <svg class="back-arrow" viewBox="0 0 12 24" aria-hidden="true"><path d="M9 6l-6 6 6 6"/></svg>
        <svg class="book" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
      </button>
      <div class="title" id="storyTitle"></div>
      <span class="back" aria-hidden="true"></span>
    </div>
    <div class="fogline"><span class="uncovered" id="uncovered"></span></div>
    <div class="demo" role="group" aria-label="Mockup controls">
      <a class="ver" href="home.html" aria-label="Switch to the home map version">⇄ Home map</a>
      <span id="lookSlot"></span>
      <a class="ver vote" href="vote.html">Vote on Looks</a>
      <button id="resetBtn">Reset</button>
    </div>
  </header>

  <div class="toast" id="toast" hidden></div>
  <div class="bottom-fade" aria-hidden="true"></div>

  <section class="card app-card" id="card">
    <button class="recenter" type="button" aria-label="Recenter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 3 10.5l7.5 3L14 21z"/></svg></button>
    <div class="objective" id="next"></div>
    <div class="switch" id="switch" role="tablist" aria-label="How to unlock this chapter"></div>
    <div class="status" id="status"></div>
    <div class="actions" id="actions"></div>
    <p class="hint" id="hint"></p>
  </section>

  <section class="sheet" id="sheet" hidden></section>
</div>
<script type="module">import(`./app.js${window.CACHE_V}`);</script>
</body>
</html>
