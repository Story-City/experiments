<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Story City · Your map (fog)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;700;900&display=swap">
<script>
window.CACHE_V = '?v=' + Date.now();
document.write(`<link rel="stylesheet" href="app.css${CACHE_V}">`);
</script>
</head>
<body data-mode="walk" class="home">
<div class="phone" id="phone">
  <svg class="map" id="map" viewBox="0 0 390 640" preserveAspectRatio="xMidYMin slice" aria-label="Your map"></svg>
  <canvas class="fog" id="fog" aria-hidden="true"></canvas>
  <svg class="map overlay" id="overlay" viewBox="0 0 390 640" preserveAspectRatio="xMidYMin slice"></svg>

  <header class="top">
    <div class="hud">
      <div class="hud-row">
        <span class="chip" id="chip"></span>
        <span class="uncovered" id="uncovered"></span>
      </div>
      <div class="hud-title" id="hudTitle"></div>
      <div class="week" id="week"></div>
    </div>
    <div class="demo" role="group" aria-label="Mockup controls">
      <span id="lookSlot"></span>
      <button id="resetBtn">Reset</button>
    </div>
  </header>

  <div class="toast" id="toast" hidden></div>

  <section class="card home-card" id="card">
    <div class="home-hint" id="hint"></div>
    <div class="near-label" id="nearLabel"></div>
    <div class="near" id="near"></div>
    <div class="actions" id="actions"></div>
  </section>

  <section class="sheet" id="sheet" hidden></section>
</div>
<script type="module">import(`./home.js${window.CACHE_V}`);</script>
</body>
</html>
