<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Daily Side Quests — full flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=2">
<meta http-equiv="Cache-Control" content="no-cache">
</head>
<body>
  <header>
    <h1>Daily Side Quests</h1>
    <p class="lede">
      Full Figma row from <code>5872:391583</code> rightward — seven frames, no invented UI.
    </p>
  </header>

  <div class="chips" id="chips" role="tablist" aria-label="Frame"></div>

  <div class="toolbar">
    <button type="button" class="play" id="prev">Back</button>
    <button type="button" class="play" id="next">Next frame</button>
    <span class="hint" id="hint"></span>
  </div>

  <main class="phone" id="phone" aria-label="Side quest prototype flow">
    <img class="frame" id="frame" src="assets/flow/01.png?v=2" alt="" width="375" height="814" decoding="async">
    <div class="shine" id="shine" aria-hidden="true"></div>
  </main>

  <p class="meta">
    Source frames listed in <code>SOURCE.md</code>. Tap Next or a chip to step the prototype.
  </p>

  <script src="app.js?v=2"></script>
</body>
</html>
