<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Daily Side Quests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=4">
<meta http-equiv="Cache-Control" content="no-cache">
</head>
<body>
  <header>
    <h1>Daily Side Quests</h1>
    <p class="lede">
      Functional Figma flow: menu → hand stamps → camera view → zoom-out settle into finds.
    </p>
  </header>

  <div class="chips" role="radiogroup" aria-label="Quest" id="picker"></div>

  <div class="toolbar">
    <button type="button" class="play" id="play">Play</button>
    <button type="button" class="play secondary" id="reset">Reset</button>
    <span class="hint" id="hint">Idle — Play opens Daily Side quests.</span>
  </div>

  <main class="phone" id="phone">
    <div class="stage" id="stage">
      <img class="scene" id="scene" src="assets/flow/01.png?v=4" alt="" decoding="async">
      <img class="find" id="find" src="assets/flow/06.png?v=4" alt="" hidden>
      <div class="tip" id="tip" hidden>
        <img src="assets/flow/07.png?v=4" alt="" decoding="async">
      </div>
    </div>

    <!-- Hotspots aligned to Figma chrome — no reinvented buttons -->
    <button type="button" class="hot stamp-hot" data-stamp="0" aria-label="Stamp 1" hidden></button>
    <button type="button" class="hot stamp-hot" data-stamp="1" aria-label="Stamp 2" hidden></button>
    <button type="button" class="hot stamp-hot" data-stamp="2" aria-label="Stamp 3" hidden></button>
    <button type="button" class="hot cam-hot" id="camHot" aria-label="Camera" hidden></button>
    <button type="button" class="hot close-hot" id="closeHot" aria-label="Close" hidden></button>
    <button type="button" class="hot entry-hot" id="entryHot" aria-label="Side quest entry" hidden></button>
    <button type="button" class="hot back-hot" id="backHot" aria-label="Back" hidden></button>
    <button type="button" class="hot map-hot" id="mapHot" aria-label="Map find" hidden></button>

    <div class="shine" id="shine" aria-hidden="true"></div>
    <div class="flash" id="flash" aria-hidden="true"></div>

    <!-- Real camera — map/camera hotspot → zoom in → shutter → zoom-out settle -->
    <div class="camera" id="camera" aria-hidden="true">
      <video class="camera-video" id="cameraVideo" playsinline muted></video>
      <div class="camera-fallback" id="cameraFallback" hidden>Camera unavailable — tap shutter to continue.</div>
      <div class="camera-haze"></div>
      <p class="camera-label" id="cameraLabel">Find a pattern, then shutter</p>
      <button type="button" class="shutter" id="shutter" aria-label="Shutter"></button>
      <button type="button" class="camera-close" id="cameraClose" aria-label="Close camera">✕</button>
    </div>
  </main>

  <p class="meta">Figma row <code>5872:391583</code> → map hunt. Mechanics: camera → zoom-out → settle.</p>
  <script src="app.js?v=4"></script>
</body>
</html>
